<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <style>html,body{margin:0;background:#1A3D1F;}</style>
</head>
<body>
<script>
(async function() {
  try {
    if (window.Capacitor && Capacitor.isNativePlatform()) {
      var AdMob = Capacitor.Plugins.AdMob;
      if (AdMob) {
        if (Capacitor.getPlatform() === 'ios') {
          // ATT is handled natively in AppDelegate.swift
          // Wait for ATT dialog before initializing AdMob
          await new Promise(function(resolve) { setTimeout(resolve, 2000); });
        }
        await AdMob.initialize();
      }
    }
  } catch(e) {
    // Non-fatal: continue to app regardless
  }

  if (localStorage.getItem('chefName')) {
    window.location.replace('packages.html');
  } else {
    window.location.replace('onboarding.html');
  }
})();
</script>
</body>
</html>
