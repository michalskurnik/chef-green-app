<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>השף הירוק</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;
  background:#1A3D1F;
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}

#screen{
  position:fixed;inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:#1A3D1F;
}

/* ── Video fills screen, letter-boxed ── */
#video-wrap{
  position:relative;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}
#intro-video{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
  background:#000;
}

/* ── Skip button ── */
#skip-btn{
  position:fixed;
  top:calc(env(safe-area-inset-top,12px) + 12px);
  left:16px;
  z-index:10;
  background:rgba(0,0,0,.45);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  border:1.5px solid rgba(255,255,255,.3);
  border-radius:20px;
  color:#fff;
  font-family:'Rubik',sans-serif;
  font-size:14px;
  font-weight:700;
  padding:8px 18px;
  cursor:pointer;
  touch-action:manipulation;
  transition:background .15s;
}
#skip-btn:active{background:rgba(0,0,0,.7)}

/* ── Progress bar at bottom ── */
#progress-bar-wrap{
  position:fixed;
  bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  left:24px;right:24px;
  height:3px;
  background:rgba(255,255,255,.2);
  border-radius:3px;
  z-index:10;
  overflow:hidden;
}
#progress-bar{
  height:100%;
  width:0%;
  background:#F5921E;
  border-radius:3px;
  transition:width .25s linear;
}

/* ── Loading spinner (shown before video plays) ── */
#loader{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:#1A3D1F;
  z-index:20;
  transition:opacity .4s;
}
#loader.hidden{opacity:0;pointer-events:none}
.spinner{
  width:44px;height:44px;
  border:4px solid rgba(255,255,255,.2);
  border-top-color:#F5921E;
  border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Tap-to-play (shown only when autoplay is blocked) ── */
#play-btn{
  position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%);
  z-index:15;
  width:84px;height:84px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);
  background:rgba(0,0,0,.45);
  color:#fff;font-size:34px;
  display:none;align-items:center;justify-content:center;
  cursor:pointer;touch-action:manipulation;
}
#play-btn.visible{display:flex}
</style>
</head>
<body>

<div id="loader"><div class="spinner"></div></div>

<div id="screen">
  <div id="video-wrap" onclick="goNext()">
    <video
      id="intro-video"
      src="../assets/video/free-index-1.mp4"
      playsinline
      webkit-playsinline
      preload="auto"
      muted
    ></video>
  </div>
</div>

<button id="play-btn" aria-label="הפעל">▶</button>

<button id="skip-btn" onclick="goNext()">דלג ←</button>

<div id="progress-bar-wrap">
  <div id="progress-bar"></div>
</div>

<script>
(function(){
  'use strict';

  var video    = document.getElementById('intro-video');
  var bar      = document.getElementById('progress-bar');
  var loader   = document.getElementById('loader');
  var playBtn  = document.getElementById('play-btn');
  var gone     = false;

  function goNext() {
    if (gone) return;
    gone = true;
    video.pause();
    window.location.href = 'packages.html';
  }

  // Tapping the video skips while it plays; if autoplay was blocked,
  // the first tap starts it instead of skipping straight past it.
  window.goNext = function() {
    if (playBtn.classList.contains('visible')) { startVideo(); return; }
    goNext();
  };

  function startVideo() {
    playBtn.classList.remove('visible');
    var p = video.play();
    if (p && p.catch) {
      p.catch(function() {
        loader.classList.add('hidden');
        playBtn.classList.add('visible');
      });
    }
  }

  playBtn.addEventListener('click', startVideo);

  // iOS WebKit often ignores preload, so 'canplay' may never fire until
  // play() is called. Start playback right away instead of waiting for it.
  video.addEventListener('playing', function() {
    loader.classList.add('hidden');
    playBtn.classList.remove('visible');
  });
  startVideo();

  // Fallback: if nothing is playing after 3s, drop the loader and offer play
  setTimeout(function() {
    loader.classList.add('hidden');
    if (video.paused && !gone) playBtn.classList.add('visible');
  }, 3000);

  // Update progress bar
  video.addEventListener('timeupdate', function() {
    if (video.duration) {
      bar.style.width = (video.currentTime / video.duration * 100) + '%';
    }
  });

  // Auto-advance when video ends
  video.addEventListener('ended', goNext);

  // If video fails to load, go straight to packages
  video.addEventListener('error', goNext);
})();
</script>
</body>
</html>
