<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>השף הירוק</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;
  background:#1A3D1F;
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}

#screen{
  position:fixed;inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:#1A3D1F;
}

/* ── Video fills screen, letter-boxed ── */
#video-wrap{
  position:relative;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}
#intro-video{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
  background:#000;
}

/* ── Skip button ── */
#skip-btn{
  position:fixed;
  top:calc(env(safe-area-inset-top,12px) + 12px);
  left:16px;
  z-index:10;
  background:rgba(0,0,0,.45);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  border:1.5px solid rgba(255,255,255,.3);
  border-radius:20px;
  color:#fff;
  font-family:'Rubik',sans-serif;
  font-size:14px;
  font-weight:700;
  padding:8px 18px;
  cursor:pointer;
  touch-action:manipulation;
  transition:background .15s;
}
#skip-btn:active{background:rgba(0,0,0,.7)}

/* ── Progress bar at bottom ── */
#progress-bar-wrap{
  position:fixed;
  bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  left:24px;right:24px;
  height:3px;
  background:rgba(255,255,255,.2);
  border-radius:3px;
  z-index:10;
  overflow:hidden;
}
#progress-bar{
  height:100%;
  width:0%;
  background:#F5921E;
  border-radius:3px;
  transition:width .25s linear;
}

/* ── Loading spinner (shown before video plays) ── */
#loader{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:#1A3D1F;
  z-index:20;
  transition:opacity .4s;
}
#loader.hidden{opacity:0;pointer-events:none}
.spinner{
  width:44px;height:44px;
  border:4px solid rgba(255,255,255,.2);
  border-top-color:#F5921E;
  border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="loader"><div class="spinner"></div></div>

<div id="screen">
  <div id="video-wrap" onclick="goNext()">
    <video
      id="intro-video"
      src="../assets/video/free-index-1.mp4"
      playsinline
      webkit-playsinline
      preload="auto"
      muted
    ></video>
  </div>
</div>

<button id="skip-btn" onclick="goNext()">דלג ←</button>

<div id="progress-bar-wrap">
  <div id="progress-bar"></div>
</div>

<script>
(function(){
  'use strict';

  var video    = document.getElementById('intro-video');
  var bar      = document.getElementById('progress-bar');
  var loader   = document.getElementById('loader');
  var gone     = false;

  function goNext() {
    if (gone) return;
    gone = true;
    video.pause();
    window.location.href = 'packages.html';
  }
  window.goNext = goNext;

  // Hide loader once video can play
  video.addEventListener('canplay', function() {
    loader.classList.add('hidden');
    video.play().catch(function() {
      // Autoplay blocked — show tap-to-play state
      loader.classList.add('hidden');
    });
  });

  // Fallback: hide loader after 3s regardless
  setTimeout(function() { loader.classList.add('hidden'); }, 3000);

  // Update progress bar
  video.addEventListener('timeupdate', function() {
    if (video.duration) {
      bar.style.width = (video.currentTime / video.duration * 100) + '%';
    }
  });

  // Auto-advance when video ends
  video.addEventListener('ended', goNext);

  // If video fails to load, go straight to packages
  video.addEventListener('error', goNext);
})();
</script>
</body>
</html>
