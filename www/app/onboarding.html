<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ברוכים הבאים | השף הירוק</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Fredoka+One&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: #1A3D1F;
      font-family: 'Varela Round', 'Heebo', Arial, sans-serif;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
    }

    /* ── Layout shell ─────────────────────────────────────── */
    .screen {
      width: 100%;
      max-width: 390px;
      height: 100svh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding:
        calc(env(safe-area-inset-top, 0px) + 12px)
        24px
        calc(env(safe-area-inset-bottom, 0px) + 28px);
    }

    /* ── Progress dots ────────────────────────────────────── */
    .progress-dots {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
      margin-bottom: 10px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.22);
      transition: width 0.3s ease, border-radius 0.3s ease, background 0.3s ease;
    }
    .dot.active {
      width: 28px;
      border-radius: 4px;
      background: #F5A623;
    }

    /* ── Chef illustration ────────────────────────────────── */
    .chef-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 0;
      min-height: 0;
      padding-bottom: 4px;
    }

    .chef-img {
      width: 100%;
      max-width: 340px;
      display: block;
      margin: 0 auto;
      flex-shrink: 1;
      min-height: 0;
      object-fit: contain;
    }

    /* Speech bubble points UP toward the chef */
    .speech-bubble {
      background: #fff;
      border-radius: 18px;
      padding: 14px 22px;
      font-family: 'Fredoka One', 'Varela Round', cursive;
      font-size: 20px;
      color: #1A3D1F;
      text-align: center;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18);
      position: relative;
      margin-top: 4px;
      flex-shrink: 0;
    }
    .speech-bubble::before {
      content: '';
      position: absolute;
      top: -11px;
      left: 50%;
      transform: translateX(-50%);
      border: 11px solid transparent;
      border-bottom-color: #fff;
      border-top: none;
    }

    /* ── Input section ────────────────────────────────────── */
    .input-section {
      width: 100%;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding-top: 18px;
    }

    .name-input {
      width: 100%;
      padding: 17px 22px;
      border-radius: 50px;
      border: 2px solid transparent;
      background: #F5F0DC;
      color: #1A3D1F;
      font-size: 18px;
      font-family: 'Varela Round', 'Heebo', Arial, sans-serif;
      text-align: center;
      outline: none;
      -webkit-appearance: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      caret-color: #F5921E;
    }
    .name-input::placeholder {
      color: rgba(26, 61, 31, 0.4);
    }
    .name-input:focus {
      border-color: #F5921E;
      box-shadow: 0 0 0 3px rgba(245, 146, 30, 0.2);
    }

    /* ── Start button ─────────────────────────────────────── */
    .btn-start {
      width: 100%;
      padding: 18px 20px;
      border-radius: 50px;
      border: none;
      background: #F5921E;
      color: #fff;
      font-size: 19px;
      font-family: 'Fredoka One', 'Varela Round', cursive;
      font-weight: 400;
      letter-spacing: 0.03em;
      cursor: pointer;
      box-shadow: 0 6px 28px rgba(245, 146, 30, 0.45);
      transition: opacity 0.2s, transform 0.15s, box-shadow 0.15s;
      -webkit-appearance: none;
    }
    .btn-start:disabled {
      background: rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.3);
      box-shadow: none;
      cursor: default;
    }
    .btn-start:not(:disabled):active {
      transform: scale(0.97);
      box-shadow: 0 3px 14px rgba(245, 146, 30, 0.3);
    }

    @keyframes btnPop {
      0%   { transform: scale(0.95); }
      60%  { transform: scale(1.03); }
      100% { transform: scale(1); }
    }
    .btn-start.pop {
      animation: btnPop 0.3s ease forwards;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 80% 60% at 50% 35%, rgba(74,140,40,0.35) 0%, transparent 70%);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="screen">

    <!-- Progress: step 1 of 3 -->
    <div class="progress-dots" aria-label="שלב 1 מתוך 3">
      <div class="dot active"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

    <!-- Chef illustration + speech bubble -->
    <div class="chef-area">
      <img
        src="../assets/images/onboarding-chef.png"
        alt="השף הירוק"
        class="chef-img"
      >
      <div class="speech-bubble">מי השף הצעיר שלנו?</div>
    </div>

    <!-- Name input + CTA -->
    <div class="input-section">
      <input
        id="nameInput"
        type="text"
        class="name-input"
        placeholder="הקלד/י את שמך כאן..."
        maxlength="20"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="words"
        spellcheck="false"
        inputmode="text"
      >
      <button id="btnStart" class="btn-start" disabled>בואו נתחיל!</button>
    </div>

  </div>

  <script>
    const input = document.getElementById('nameInput');
    const btn   = document.getElementById('btnStart');
    let wasEmpty = true;

    function updateButton() {
      const name = input.value.trim();
      const isEmpty = name.length === 0;

      if (!isEmpty) {
        btn.textContent = 'בואו נתחיל, ' + name + '!';
        if (wasEmpty) {
          btn.disabled = false;
          btn.classList.remove('pop');
          void btn.offsetWidth;
          btn.classList.add('pop');
        } else {
          btn.disabled = false;
        }
      } else {
        btn.textContent = 'בואו נתחיל!';
        btn.disabled = true;
      }

      wasEmpty = isEmpty;
    }

    function handleSubmit() {
      const name = input.value.trim();
      if (!name) return;
      localStorage.setItem('chefName', name);
      localStorage.setItem('userName', name);
      window.location.href = 'intro-video.html';
    }

    input.addEventListener('input', updateButton);
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { input.blur(); handleSubmit(); }
    });
    btn.addEventListener('click', handleSubmit);

    input.addEventListener('focus', function () {
      setTimeout(function () {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }, 300);
    });
  </script>
</body>
</html>
