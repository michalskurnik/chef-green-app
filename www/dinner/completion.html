<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>תעודת שף מתחיל 🏆</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
*{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html{touch-action:pan-y;overscroll-behavior-y:none}
body{
  background:#f5f0dc;
  font-family:'Rubik',sans-serif;
  direction:rtl;
  overflow-y:auto;
  overflow-x:hidden;
  position:relative;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 32px);
}

/* ── Certificate section ── */
.cert-section{
  width:100%;
  display:flex;
  justify-content:center;
  background:#f5f0dc;
}

/* Wrapper sized by the image */
.cert-wrap{
  position:relative;
  width:100%;
  max-width:640px;
  flex-shrink:0;
  overflow:visible;
}
.cert-bg{
  width:100%;
  display:block;
  /* image is 2400×1792 → ratio 1.3393 */
}

/* ── "ניתנת בגאווה ל:" + name, one line (GC-45) ──
   The background (certificate-bg-dinner-blank.png) is the original artwork
   with the baked "ניתנת בגאווה ל:" line removed, so the line and the name
   can sit together: the name comes right after "ל:", as on a real
   certificate. The row is centred where the baked line was (baseline ~34%
   of the image height) and may not grow past the clear paper between the
   confetti on both sides (measured 19.9%..81.2% of the width, minus a
   1.5% margin). certificate-share.js shrinks the whole row together only when a
   long name would not fit, so the line keeps its proportions. */
.cert-name-row{
  position:absolute;
  top:28.2%;
  left:50%;
  transform:translateX(-50%);
  max-width:57%;
  white-space:nowrap;
  text-align:center;
  pointer-events:none;
  font-size:clamp(14px,5vw,32px);
  line-height:1.25;
}
.cert-subline{
  display:inline-block;
  vertical-align:baseline;
  font-family:'Rubik',sans-serif;
  font-weight:700;
  font-size:.66em;
  color:#310A02;
}
.cert-name{
  display:inline-block;
  vertical-align:baseline;
  margin-inline-start:.3em;
  font-family:'Fredoka One',cursive;
  color:#8B4513;
  text-shadow:0 1px 4px rgba(255,255,255,.9);
  letter-spacing:.5px;
}

/* ── Photo upload circle ──
   Sits inside the rope circle of the artwork (GC-45). Measured on the image:
   rope centre 61.6% from top, rope inner diameter ~28.5% of the width
   (outer ~31%). The old 63% / 31% box covered the whole rope and ran past
   its bottom. */
.cert-photo-wrap{
  position:absolute;
  top:61.6%;
  left:50%;
  transform:translate(-50%,-50%);
  width:28.6%;
  aspect-ratio:1;
  border-radius:50%;
  overflow:hidden;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,253,240,.15);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
  transition:opacity .15s;
}
.cert-photo-wrap:active{opacity:.8}

.cert-photo-img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
  display:none;
}
/* GC-45: not shown on this certificate. The artwork already has its own
   "[הכנס תמונה]" placeholder and chef icon inside the rope, and the hint
   sat right on top of them. Tapping the circle still opens the photo picker. */
.cert-camera-hint{
  visibility:hidden;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
  pointer-events:none;
}
.cam-icon{font-size:clamp(18px,6vw,48px);line-height:1}
.cam-label{
  font-family:'Rubik',sans-serif;
  font-size:clamp(7px,2vw,13px);
  font-weight:700;
  color:#7a5c1e;
  text-align:center;
  line-height:1.25;
}

/* ── Achievement text ──
   Right under the name line, where the artwork's decorative rule was (the
   rule is removed in certificate-bg-dinner-blank.png, clear paper from 36%
   to 41% of the height, above the rope). Below the rope there is no clear
   paper at all (flourish and scrolls), so it cannot go there (GC-45). */
.cert-achievement{
  position:absolute;
  top:36.4%;
  left:50%;
  transform:translateX(-50%);
  font-family:'Rubik',sans-serif;
  font-size:clamp(9px,2.4vw,15px);
  font-weight:600;
  color:#5a3e1b;
  white-space:nowrap;
  text-align:center;
  pointer-events:none;
  text-shadow:0 1px 3px rgba(255,255,255,.8);
  max-width:57%;
}

/* ── Share button loading state ── */
.btn-wa:disabled{opacity:.7;cursor:not-allowed;transform:none!important}

/* ── Buttons ── */
.buttons-section{
  max-width:480px;
  margin:0 auto;
  padding:20px 20px 48px;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.btn-wa{
  display:block;
  width:100%;
  background:#25D366;
  color:#fff;
  text-align:center;
  text-decoration:none;
  font-family:'Rubik',sans-serif;
  font-size:17px;
  font-weight:700;
  padding:16px 24px;
  border-radius:50px;
  border:none;
  cursor:pointer;
  box-shadow:0 4px 18px rgba(37,211,102,.4);
  touch-action:manipulation;
  transition:transform .1s,opacity .15s;
}
.btn-wa:active{transform:scale(.97);opacity:.9}

.btn-print{
  width:100%;
  background:#fff;
  color:#25D366;
  border:2px solid #25D366;
  border-radius:50px;
  padding:15px 24px;
  font-size:17px;
  font-family:'Rubik',sans-serif;
  font-weight:700;
  cursor:pointer;
  touch-action:manipulation;
  transition:transform .1s;
}
.btn-print:active{transform:scale(.97)}

.btn-next{
  display:block;
  width:100%;
  background:#F5921E;
  color:#fff;
  text-align:center;
  text-decoration:none;
  font-family:'Rubik',sans-serif;
  font-size:17px;
  font-weight:700;
  padding:16px 24px;
  border-radius:50px;
  border:none;
  cursor:pointer;
  box-shadow:0 4px 18px rgba(245,146,30,.4);
  touch-action:manipulation;
  transition:transform .1s;
}
.btn-next:active{transform:scale(.97)}

/* ── Print ── */
@media print{
  .buttons-section{display:none!important}
  body{padding:0;background:#fff}
  .cert-section{display:block}
  .cert-wrap{max-width:100%!important;width:100%!important}
  .cert-camera-hint{display:none}
}

/* ── iPad ── */
@media(min-width:768px){
  .cert-wrap{max-width:640px;margin:0 auto}
  .cert-name-row{font-size:clamp(18px,3.2vw,34px)}
  .cert-achievement{font-size:clamp(11px,1.6vw,17px)}
  .cam-icon{font-size:clamp(24px,3.5vw,52px)}
  .cam-label{font-size:clamp(9px,1.2vw,15px)}
  .buttons-section{max-width:520px;padding:24px 24px 56px}
  .btn-wa,.btn-print,.btn-next{font-size:20px;padding:18px 28px}
}
</style>
</head>
<body>

<!-- ══ Certificate ══════════════════════════════════════ -->
<div class="cert-section">
  <div class="cert-wrap" id="certificate-card">

    <!-- Background image -->
    <img src="../assets/images/certificate-bg-dinner-blank.png"
         class="cert-bg"
         alt="תעודת שף מתחיל">

    <!-- "ניתנת בגאווה ל:" + child's name (read from localStorage), one line -->
    <div class="cert-name-row" data-fit><span class="cert-subline">ניתנת בגאווה ל:</span><span class="cert-name" id="cert-name"></span></div>

    <!-- Photo upload circle (over rope-bordered avatar area) -->
    <div class="cert-photo-wrap" id="cert-photo-wrap" role="img" aria-label="תמונת הילד">
      <img id="cert-photo-img" class="cert-photo-img" alt="">
      <div class="cert-camera-hint" id="cert-camera-hint">
        <span class="cam-icon">📷</span>
        <span class="cam-label">הוסיפו<br>תמונה</span>
      </div>
      <input type="file" id="photo-input" accept="image/*" style="display:none">
    </div>

    <!-- Achievement text (under the name line, above the photo) -->
    <div class="cert-achievement" data-fit>על השלמת הרפתקת ארוחת הערב 🍽️</div>

  </div>
</div>

<!-- ══ Buttons ══════════════════════════════════════════ -->
<div class="buttons-section">
  <button id="btn-wa" class="btn-wa" onclick="shareCertificate()">
    שיתוף לוואטסאפ 📲
  </button>
  <button class="btn-print" onclick="printCertificate(this)">הדפסה 🖨️</button>
  <a href="../app/packages.html" class="btn-next">לבחירת הרפתקה הבאה ←</a>
</div>

<script>
(function () {
  'use strict';

  // ── Load child's name ──────────────────────────────────
  var chefName = localStorage.getItem('chefName') || '';
  if (chefName) {
    document.getElementById('cert-name').textContent = chefName;
  }

  // ── Photo upload — restore saved photo on load ─────────
  var photoWrap  = document.getElementById('cert-photo-wrap');
  var photoImg   = document.getElementById('cert-photo-img');
  var cameraHint = document.getElementById('cert-camera-hint');
  var photoInput = document.getElementById('photo-input');

  var savedPhoto = localStorage.getItem('childPhoto');
  if (savedPhoto) {
    photoImg.src = savedPhoto;
    photoImg.style.display = 'block';
    cameraHint.style.display = 'none';
  }

  photoWrap.addEventListener('click', function () {
    photoInput.click();
  });

  photoInput.addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function (ev) {
      // Phone photos are several MB; stored as-is they exceed the
      // localStorage quota and setItem throws, so the photo never showed.
      // Shrink to 800px before saving.
      var img = new Image();
      img.onload = function () {
        var scale = Math.min(1, 800 / Math.max(img.width, img.height));
        var canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        var dataUrl = canvas.toDataURL('image/jpeg', 0.85);
        photoImg.src = dataUrl;
        photoImg.style.display = 'block';
        cameraHint.style.display = 'none';
        try { localStorage.setItem('childPhoto', dataUrl); } catch (err) {}
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

})();
</script>
<script>
  // This background already has its title and rope circle baked into the
  // artwork - no title/subline/ring should be drawn on top.
  window.CERT_CONFIG = { bg: '../assets/images/certificate-bg-dinner-blank.png' };
</script>
<script src="../assets/certificate-share.js"></script>

</body>
</html>
