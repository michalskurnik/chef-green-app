}
renderRecipeBook({ back: 'index.html', items: [
  { name: 'רובוט טורטייה',      emoji: '🤖', done: done(1), from: 'game3.html' },
  { name: 'ארנבת ביצה',         emoji: '🐰', done: done(2), from: 'game5.html' },
  { name: 'קאסדייה בצורות',     emoji: '🫓', done: done(3), from: 'game7.html' },
  { name: 'שבלולי פיצה פריכים', emoji: '🍕', done: done(4), from: 'game9.html' },
  { name: 'פסטה ברוטב בזוקה',   emoji: '🍝', done: done(5), from: 'game11.html' }
]});
