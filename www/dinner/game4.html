<!-- REUSABLE: change DISH_NAME, REQUIRED, ALL_INGREDIENTS array,
     and the dish image src attribute to adapt this game for other recipes -->
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Rubik:wght@400;700&display=swap" rel="stylesheet">
<title>ארנבת ביצה — גלו את המנה</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html{touch-action:pan-y;overscroll-behavior-y:none}
body{background:#FFF8E7;display:flex;justify-content:center;font-family:'Rubik',sans-serif;direction:rtl;min-height:100vh;overflow-y:auto;overflow-x:hidden;position:relative;height:auto;overscroll-behavior-y:none;padding-bottom:80px}

#app{width:100%;max-width:430px;background:#fff;box-shadow:0 8px 32px rgba(0,0,0,.12);min-height:100vh;display:flex;flex-direction:column;animation:fadeUp .4s ease}

@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes starPop{from{transform:scale(0) rotate(-15deg);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes correctPulse{0%{transform:scale(1)}40%{transform:scale(1.15)}70%{transform:scale(.95)}100%{transform:scale(1)}}
@keyframes confettiFall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(200px) rotate(720deg);opacity:0}}

#hdr{padding:12px 16px 14px;color:#fff;text-align:center;background:linear-gradient(135deg,#B5186A,#E91E8C);flex-shrink:0;transition:background .7s}
#hdr.done{background:linear-gradient(135deg,#FF6B35,#F7C948)}
#badge{display:inline-block;background:rgba(255,255,255,.22);border-radius:20px;padding:2px 12px;font-size:13px;font-weight:700;margin-bottom:5px}
#htitle{font-family:'Fredoka One',cursive;font-size:22px;margin-bottom:3px}
#hsub{font-size:13px;opacity:.9;font-weight:500;line-height:1.4}

/* ── Reveal area ── */
#reveal-wrap{position:relative;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:12px 0}
.dish-stack{position:relative;width:min(70vw,320px);height:min(70vw,320px)}
#img-outline,#img-complete{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:50%;object-fit:cover;transition:opacity 0.8s ease}
#img-outline{opacity:1}
#img-complete{opacity:0}
#reveal-wrap.stage-1 #img-outline{opacity:0.66}
#reveal-wrap.stage-1 #img-complete{opacity:0.33}
#reveal-wrap.stage-2 #img-outline{opacity:0.33}
#reveal-wrap.stage-2 #img-complete{opacity:0.66}
#reveal-wrap.stage-3 #img-outline{opacity:0}
#reveal-wrap.stage-3 #img-complete{opacity:1}

#stage-label{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.62);color:#fff;font-family:'Fredoka One',cursive;font-size:14px;border-radius:12px;padding:4px 11px;backdrop-filter:blur(4px)}

/* ── Progress dots ── */
#progress-dots{display:flex;gap:10px;align-items:center;justify-content:center;padding:10px 0 4px;flex-shrink:0}
.pdot{width:11px;height:11px;border-radius:50%;background:#DDD;transition:background .4s,transform .3s}
.pdot.filled{background:#B5186A;transform:scale(1.3)}

/* ── Ingredient bank ── */
#bank-label{text-align:center;font-family:'Fredoka One',cursive;font-size:16px;color:#5D4037;padding:6px 16px 10px;flex-shrink:0}
#bank{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 14px 16px;flex-shrink:0}
.ingr-card{display:flex;flex-direction:column;align-items:center;gap:5px;padding:14px 6px 12px;border-radius:16px;border:2.5px solid #EDD8B0;background:#FFFDF5;cursor:pointer;touch-action:manipulation;transition:border-color .15s,background .15s,transform .15s;min-height:80px}
.ingr-card:not(.done):active{transform:scale(.92)}
.ingr-card .ic-em{font-size:32px;line-height:1}
.ingr-card .ic-lb{font-family:'Fredoka One',cursive;font-size:13px;color:#5D4037;text-align:center}
.ingr-card.correct{border-color:#4CAF50;background:#E8F5E9;animation:correctPulse .45s ease;pointer-events:none}
.ingr-card.correct .ic-lb{color:#2E7D32}
.ingr-card.wrong{border-color:#EF5350;background:#FFEBEE;animation:shake .35s ease}
.ingr-card.wrong .ic-lb{color:#C62828}
.ingr-card.done{opacity:.38;pointer-events:none;transform:scale(.9)}

/* ── Done panel ── */
#done-panel{display:none;flex-direction:column;align-items:center;padding:16px 20px 40px;background:#fff;text-align:center;flex-shrink:0}
#stars{display:flex;gap:12px;padding:4px 0 10px}
.str{font-size:44px;filter:drop-shadow(0 2px 6px gold)}
#dmsg{font-size:15px;font-weight:700;color:#636e72;line-height:1.7;margin-bottom:18px}
#nbtn{background:linear-gradient(135deg,#B5186A,#E91E8C);color:#fff;border:none;border-radius:18px;padding:14px 44px;font-size:18px;font-family:'Fredoka One',cursive;cursor:pointer;touch-action:manipulation;box-shadow:0 5px 18px rgba(181,24,106,.42)}

.confetti-piece{position:fixed;width:8px;height:8px;border-radius:2px;pointer-events:none;animation:confettiFall 1.5s ease-out forwards;z-index:999}

@media(min-width:768px){
  #app{max-width:650px}
  #htitle{font-size:28px}
  #hsub{font-size:16px}
  #bank-label{font-size:20px}
  .ingr-card{min-height:100px;padding:18px 10px}
  .ingr-card .ic-em{font-size:42px}
  .ingr-card .ic-lb{font-size:16px}
  #nbtn{font-size:22px;padding:18px 54px}
  #stage-label{font-size:17px;padding:6px 14px}
  .pdot{width:14px;height:14px}
}
</style>
</head>
<body>
<div id="app">

  <div id="hdr">
    <div id="badge">🐰 משחק 1 מתוך 2</div>
    <h2 id="htitle">🔍 גלו את המנה!</h2>
    <p id="hsub">בחרו את המרכיבים הנכונים כדי לגלות את ארנבת הביצה</p>
  </div>

  <div id="reveal-wrap">
    <div class="dish-stack">
    <img id="img-outline" src="../assets/images/bunny-outline.png" alt="אַרנבת ביצה">
    <img id="img-complete" src="../assets/images/bunny-complete.png" alt="אַרנבת ביצה">
  </div>
    <div id="stage-label">🔒 0 / 3 מרכיבים</div>
  </div>

  <div id="progress-dots">
    <div class="pdot" id="d0"></div>
    <div class="pdot" id="d1"></div>
    <div class="pdot" id="d2"></div>
  </div>

  <div id="bank-label">🛒 מה יש בצלחת?</div>
  <div id="bank"></div>

  <div id="done-panel">
    <div id="stars">
      <span class="str" style="animation:starPop .5s 0s both">⭐</span>
      <span class="str" style="animation:starPop .5s .18s both">⭐</span>
      <span class="str" style="animation:starPop .5s .36s both">⭐</span>
    </div>
    <p id="dmsg">🐰 כל הכבוד! גיליתם את ארנבת הביצה!<br>עכשיו ניצור אותה יחד 🥕🥚🥬</p>
    <button id="nbtn" onclick="goNext()">המשחק הבא ▶</button>
  </div>

</div><!-- /app -->
<script>
/* REUSABLE: change DISH_NAME, REQUIRED, ALL_INGREDIENTS, and the dish image src to use this game for other recipes */
const DISH_NAME = 'ארנבת ביצה';
const REQUIRED  = ['ביצה','חסה','גזר'];
const ALL_INGREDIENTS = [
  {name:'ביצה',   emoji:'🥚', correct:true},
  {name:'חסה',    emoji:'🥬', correct:true},
  {name:'גזר',    emoji:'🥕', correct:true},
  {name:'פיצה',   emoji:'🍕', correct:false},
  {name:'שוקולד', emoji:'🍫', correct:false},
  {name:'דג',     emoji:'🐟', correct:false},
];

// Shuffle so order is random each play
const shuffled = [...ALL_INGREDIENTS].sort(()=>Math.random()-.5);
let correctFound = 0;
const TOTAL = REQUIRED.length;

// Build ingredient cards
const bank = document.getElementById('bank');
shuffled.forEach(ig=>{
  const card = document.createElement('div');
  card.className = 'ingr-card';
  card.dataset.correct = ig.correct;
  card.innerHTML = '<span class="ic-em">'+ig.emoji+'</span><span class="ic-lb">'+ig.name+'</span>';
  card.addEventListener('click', ()=>onTap(card,ig));
  bank.appendChild(card);
});

function onTap(card,ig){
  if(card.classList.contains('correct')||card.classList.contains('done')) return;
  if(ig.correct){
    card.classList.add('correct');
    setTimeout(()=>card.classList.add('done'), 500);
    correctFound++;
    updateReveal();
    updateDots();
    updateLabel();
    if(correctFound===TOTAL) setTimeout(onWin, 900);
  } else {
    card.classList.add('wrong');
    setTimeout(()=>card.classList.remove('wrong'), 420);
  }
}

// Stage 0 = brightness(0) silhouette (CSS default)
// Stage 1/2/3 = progressively brighter via class
function updateReveal(){
  document.getElementById('reveal-wrap').className = correctFound > 0 ? 'stage-'+correctFound : '';
}
function updateDots(){
  for(let i=0;i<correctFound;i++){
    const d=document.getElementById('d'+i);
    if(d) d.classList.add('filled');
  }
}
function updateLabel(){
  document.getElementById('stage-label').textContent =
    correctFound<TOTAL
      ? '\u{1F50D} '+correctFound+' / '+TOTAL+' מרכיבים'
      : '✅ '+TOTAL+' / '+TOTAL+' — נגלה!';
}

function onWin(){
  document.getElementById('hdr').classList.add('done');
  document.getElementById('htitle').textContent = '\u{1F430} '+DISH_NAME+' נגלתה!';
  document.getElementById('hsub').textContent = 'כל הכבוד — מצאתם את כל המרכיבים! \u{1F389}';
  document.getElementById('bank-label').style.display='none';
  document.getElementById('bank').style.display='none';
  document.getElementById('done-panel').style.display='flex';
  launchConfetti();
}

function goNext(){
  localStorage.setItem('game4_completed','1');
  window.location.href='game5.html';
}

function launchConfetti(){
  const colors=['#B5186A','#F5921E','#4CAF50','#2196F3','#FFC107','#9C27B0'];
  for(let i=0;i<32;i++){
    setTimeout(()=>{
      const p=document.createElement('div');
      p.className='confetti-piece';
      p.style.left=(12+Math.random()*76)+'%';
      p.style.top=(5+Math.random()*25)+'%';
      p.style.background=colors[Math.floor(Math.random()*colors.length)];
      p.style.animationDuration=(1+Math.random()*.9)+'s';
      p.style.animationDelay=(Math.random()*.35)+'s';
      p.style.borderRadius=Math.random()>.5?'50%':'3px';
      document.body.appendChild(p);
      setTimeout(()=>p.remove(),2600);
    }, i*38);
  }
}
</script>
</body>
</html>
