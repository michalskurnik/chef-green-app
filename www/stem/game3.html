<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<script src="../assets/rc-config.js"></script>
<script src="../assets/stem-config.js"></script>
<script src="access-guard.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Assistant:wght@700;800&display=swap" rel="stylesheet">
<title>מעבדת הסמיכות – ריבת תותים</title>
<style>
:root{ --c1:#C62839; --c2:#E0546B; }
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
*{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html{touch-action:pan-y;overscroll-behavior-y:none}
body{background:#F5F0DC;display:flex;justify-content:center;padding:16px 10px 36px;font-family:'Assistant',sans-serif;direction:rtl;min-height:100vh;overflow-x:hidden}
button{touch-action:manipulation;-webkit-appearance:none;font-family:inherit}

#app{width:100%;max-width:400px;background:#fff;border-radius:26px;box-shadow:0 12px 40px rgba(0,0,0,.13);overflow:hidden;animation:fadeUp .4s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

#hdr{padding:14px 18px 16px;color:#fff;text-align:center;background:linear-gradient(135deg,var(--c1),var(--c2));position:relative}
#level-badge{position:absolute;top:12px;left:14px;background:rgba(255,255,255,.25);border-radius:12px;padding:3px 10px;font-size:11px;font-weight:800;color:#fff}
#badge{display:inline-block;background:rgba(255,255,255,.22);border-radius:20px;padding:3px 14px;font-size:12px;font-weight:700;margin-bottom:6px}
#htitle{font-family:'Fredoka One',cursive;font-size:20px}

#root{padding:20px 20px 28px;min-height:52vh;display:flex;flex-direction:column;justify-content:center}
.intro{font-size:16px;font-weight:700;color:#444;text-align:center;margin-bottom:18px;line-height:1.6}

/* Prediction / conclusion cards (shared look) */
.opt-row{display:flex;flex-direction:column;gap:14px;margin-top:4px}
.opt-card{position:relative;display:flex;align-items:center;gap:16px;background:#f7f7f7;border:2px solid #eee;border-radius:20px;padding:16px 20px;cursor:pointer;transition:all .2s}
.opt-card:active{transform:scale(.98)}
.opt-card.picked{border-color:var(--c1);background:rgba(0,0,0,.02)}
.opt-card.correct-pick{border-color:#F7C948;background:rgba(247,201,72,.15)}
.opt-card.wrong{animation:cardShake .4s ease;border-color:#EF5350}
@keyframes cardShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.conclusion-msg{min-height:20px;font-size:14px;font-weight:700;color:#7a5c1e;text-align:center;margin-top:2px}
.opt-icon-wrap{position:relative;flex-shrink:0;width:58px;height:58px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.12);overflow:hidden}
.opt-icon-wrap img{position:absolute;object-fit:contain}
.opt-icon-wrap img.node-apple{width:34px;height:34px;top:6px;left:6px}
.opt-icon-wrap img.node-strawberry{width:34px;height:34px;bottom:6px;right:6px}
.opt-icon-wrap img.node-solo{width:44px;height:44px;top:7px;left:7px}
.opt-icon{font-size:30px;position:relative;z-index:1}
.opt-label{font-size:15px;font-weight:700;color:#333}

.lab-btn{display:block;width:100%;border:none;border-radius:18px;padding:14px;font-size:16px;font-family:'Fredoka One',cursive;cursor:pointer;margin-top:14px;transition:opacity .2s,transform .1s}
.lab-btn:active{transform:scale(.97)}
.lab-btn.primary{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;box-shadow:0 5px 18px rgba(0,0,0,.18)}
.lab-btn.primary:disabled{opacity:.4;pointer-events:none}
.lab-btn.ghost{background:none;color:#999;box-shadow:none;font-family:'Assistant',sans-serif;font-weight:800;font-size:13px;text-decoration:underline}

/* Net canvas */
#net-wrap{position:relative;width:100%;height:260px;background:linear-gradient(180deg,#fff0f2,#ffe3e7);border-radius:16px;overflow:hidden;border:2px solid #f5d0d5;margin-bottom:10px}
.dot{position:absolute;width:16px;height:16px;border-radius:50%;background:#C62839;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);transform:translate(-50%,-50%);cursor:pointer;z-index:3}
.dot.apple{background:#6FA84B}
.dot.active{box-shadow:0 0 0 4px rgba(247,201,72,.6)}
.net-line{position:absolute;height:2px;background:rgba(198,40,57,.55);transform-origin:0 0;z-index:2;pointer-events:none}
.drop{position:absolute;font-size:15px;transform:translate(-50%,-50%);transition:opacity .4s,transform .4s;z-index:4;pointer-events:none}
.drop.caught{opacity:0;transform:translate(-50%,-50%) scale(.2)}
#net-hud{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:#888;margin-bottom:8px}
#net-msg{text-align:center;font-size:13px;font-weight:700;color:#7a5c1e;min-height:18px;margin-bottom:6px}

/* Cold plate */
.plate-row{display:flex;justify-content:center;gap:22px;margin:10px 0}
.plate{display:flex;flex-direction:column;align-items:center;gap:6px}
.plate-visual{width:78px;height:78px;border-radius:50%;background:radial-gradient(circle,#eaf6ff,#cfeaf9);border:3px solid #bcdff2;display:flex;align-items:center;justify-content:center;font-size:26px;position:relative;overflow:hidden}
.jam-drop{position:absolute;bottom:6px;width:22px;height:14px;border-radius:0 0 50% 50%/0 0 60% 60%;background:linear-gradient(180deg,#C62839,#8f1c29);transition:width 1.4s ease,height 1.4s ease}
.jam-drop.spread{width:52px;height:8px;border-radius:50%}
.plate-label{font-size:12px;font-weight:800;color:#555;text-align:center}
.plate-verdict{font-size:12px;font-weight:800;text-align:center;min-height:16px}

.lab-done{display:flex;flex-direction:column;align-items:center;padding:16px 4px}
.lab-done-emoji{font-size:44px;margin-bottom:8px}
.lab-done-title{font-family:'Fredoka One',cursive;font-size:17px;color:#333;text-align:center;margin-bottom:6px}

@media(min-width:420px){ #app{max-width:440px} }
</style>
</head>
<body>
<div id="app">
  <header id="hdr">
    <span id="level-badge"></span>
    <div id="badge">🍓 ריבת תותים</div>
    <h2 id="htitle">🕸️ מעבדת הסמיכות</h2>
  </header>
  <div id="root"></div>
</div>

<script src="unlock-logic.js"></script>
<script src="../assets/stem-notebook-config.js"></script>
<script>
(function () {
  'use strict';

  var STATION_NUM = 2; // ריבת תותים = index 1 in NOTEBOOK_STATIONS
  var NB = StemNotebookConfig.NOTEBOOK_STATIONS[STATION_NUM - 1];
  var GAME_NUM = 3;
  var root = document.getElementById('root');
  var levelBadge = document.getElementById('level-badge');

  var state = { prediction: null, caught: 0, target: 10, totalDrops: 12, path: [], drops: [], dotEls: {}, timer: null };

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html !== undefined) e.innerHTML = html;
    return e;
  }

  function setLevel(n, label) { levelBadge.textContent = label; }

  // Illustration for the two prediction cups: 'a' = strawberries + apple
  // (pectin network), 'b' = strawberries only - reuses the existing
  // stem_prop_node_* assets rather than plain emoji.
  function predIconHtml(id, icon) {
    if (id === 'a') {
      return '<span class="opt-icon-wrap"><img class="node-apple" src="assets/props/stem_prop_node_apple.png" alt=""><img class="node-strawberry" src="assets/props/stem_prop_node_strawberry.png" alt=""></span>';
    }
    if (id === 'b') {
      return '<span class="opt-icon-wrap"><img class="node-solo" src="assets/props/stem_prop_node_strawberry.png" alt=""></span>';
    }
    return '<span class="opt-icon-wrap"><span class="opt-icon">' + icon + '</span></span>';
  }

  // ── Screen 1: prediction ───────────────────────────────────────────
  function renderPrediction() {
    setLevel(1, 'שלב 1 מתוך 4');
    root.innerHTML = '';
    root.appendChild(el('p', 'intro', NB.predictionQ));
    var row = el('div', 'opt-row');
    Object.keys(NB.cards).forEach(function (id) {
      var c = NB.cards[id];
      var card = el('div', 'opt-card', predIconHtml(id, c.icon) + '<span class="opt-label">' + c.label + '</span>');
      card.onclick = function () {
        state.prediction = id;
        localStorage.setItem('stem_station' + STATION_NUM + '_prediction', id);
        document.querySelectorAll('.opt-card').forEach(function (cc) { cc.classList.remove('picked'); });
        card.classList.add('picked');
        setTimeout(renderNetIntro, 400);
      };
      row.appendChild(card);
    });
    root.appendChild(row);
  }

  // ── Screen 2: level 1 net demo (strawberries only - can't catch) ───
  function renderNetIntro() {
    setLevel(2, 'שלב 2 מתוך 4');
    root.innerHTML = '';
    root.appendChild(el('p', 'intro', 'תותים לבד בונים רשת דלילה מדי — אי אפשר ללכוד בה טיפות מיץ. בואו נראה, ואז נוסיף תפוח!'));

    var wrap = el('div', 'net-wrap');
    wrap.style.height = '160px';
    // 5 static strawberry dots + faint static lines, purely illustrative
    var pts = [[20,30],[80,20],[50,70],[15,90],[85,85]];
    pts.forEach(function (p) {
      var d = el('div', 'dot');
      d.style.left = p[0] + '%'; d.style.top = p[1] + '%';
      wrap.appendChild(d);
    });
    [[0,1],[1,2],[2,3],[3,4],[4,0]].forEach(function (pair) {
      wrap.appendChild(staticLine(pts[pair[0]], pts[pair[1]], wrap));
    });
    root.appendChild(wrap);
    root.appendChild(el('p', 'intro', '🕸️ אין מספיק חוטים כדי ללכוד טיפות מיץ...'));

    var btn = el('button', 'lab-btn primary', '🍏 בואו נוסיף תפוח!');
    btn.onclick = renderNetGame;
    root.appendChild(btn);
  }

  function staticLine(a, b, wrap) {
    var line = el('div', 'net-line');
    var rect = { w: 100, h: 100 };
    var dx = (b[0] - a[0]), dy = (b[1] - a[1]);
    var lenPct = Math.sqrt(dx * dx + dy * dy);
    line.style.left = a[0] + '%';
    line.style.top = a[1] + '%';
    line.style.width = lenPct + '%';
    line.style.transform = 'rotate(' + (Math.atan2(dy, dx) * 180 / Math.PI) + 'deg)';
    line.style.opacity = '.5';
    return line;
  }

  // ── Screen 3: level 2 - real interactive net + drops ────────────────
  var DOTS = (function () {
    // Deterministic layout: 5 "strawberry" dots + 12 "apple" dots, spread
    // across the canvas (percent coordinates).
    var straw = [[10,15],[90,12],[50,50],[8,85],[92,88]];
    var apple = [[30,10],[70,10],[15,35],[85,35],[35,30],[65,30],
                 [20,60],[80,60],[45,75],[55,75],[30,90],[70,90]];
    var all = [];
    straw.forEach(function (p) { all.push({ x: p[0], y: p[1], type: 'straw' }); });
    apple.forEach(function (p) { all.push({ x: p[0], y: p[1], type: 'apple' }); });
    return all;
  })();

  function renderNetGame() {
    setLevel(3, 'שלב 3 מתוך 4');
    root.innerHTML = '';
    root.appendChild(el('p', 'intro', 'עכשיו יש גם תפוח! גררו קו בין הנקודות (הקישו לפי סדר), וכשתסגרו צורה — היא תלכוד טיפות מיץ בפנים.'));

    var hud = el('div', '', '');
    hud.id = 'net-hud';
    hud.innerHTML = '<span>🍯 נלכדו: <b id="catch-count">0</b> / ' + state.target + '</span><span>טיפות בסך הכל: ' + state.totalDrops + '</span>';
    root.appendChild(hud);

    var msg = el('div', '', '');
    msg.id = 'net-msg';
    root.appendChild(msg);

    var wrap = el('div', 'net-wrap');
    wrap.id = 'net-wrap';
    root.appendChild(wrap);

    var btnRow = el('div', '', '');
    btnRow.style.display = 'flex';
    btnRow.style.gap = '8px';
    var closeBtn = el('button', 'lab-btn primary', '🔒 סגרו את הצורה');
    closeBtn.id = 'close-net-btn';
    closeBtn.style.flex = '1';
    closeBtn.disabled = true;
    closeBtn.onclick = closeLoop;
    var clearBtn = el('button', 'lab-btn ghost', 'נקו קווים');
    clearBtn.onclick = clearPath;
    root.appendChild(closeBtn);
    root.appendChild(clearBtn);

    var contBtn = el('button', 'lab-btn primary', 'למדוד את הריבה →');
    contBtn.id = 'net-continue-btn';
    contBtn.style.display = 'none';
    contBtn.onclick = function () { clearInterval(state.timer); renderColdPlate(); };
    root.appendChild(contBtn);

    buildDots(wrap);
    spawnDrops(wrap);
    state.timer = setInterval(function () { stepDrops(wrap); }, 50);
  }

  function buildDots(wrap) {
    state.dotEls = {};
    DOTS.forEach(function (p, i) {
      var d = el('div', 'dot' + (p.type === 'apple' ? ' apple' : ''));
      d.style.left = p.x + '%';
      d.style.top = p.y + '%';
      d.dataset.idx = i;
      d.onclick = function () { tapDot(i, d); };
      wrap.appendChild(d);
      state.dotEls[i] = d;
    });
  }

  function tapDot(i, d) {
    if (state.path.indexOf(i) === -1) {
      state.path.push(i);
      d.classList.add('active');
      if (state.path.length > 1) {
        var a = DOTS[state.path[state.path.length - 2]], b = DOTS[i];
        drawLine(a, b, document.getElementById('net-wrap'));
      }
      document.getElementById('close-net-btn').disabled = state.path.length < 3;
    }
  }

  function drawLine(a, b, wrap) {
    var line = el('div', 'net-line');
    var dx = b.x - a.x, dy = b.y - a.y;
    var len = Math.sqrt(dx * dx + dy * dy);
    line.style.left = a.x + '%';
    line.style.top = a.y + '%';
    line.style.width = len + '%';
    line.style.transform = 'rotate(' + (Math.atan2(dy * (wrap.clientHeight / wrap.clientWidth || 1), dx) * 180 / Math.PI) + 'deg)';
    wrap.appendChild(line);
  }

  function clearPath() {
    state.path.forEach(function (i) { state.dotEls[i].classList.remove('active'); });
    state.path = [];
    document.querySelectorAll('.net-line').forEach(function (l) { l.remove(); });
    document.getElementById('close-net-btn').disabled = true;
  }

  // Point-in-polygon (ray casting) in percent-space.
  function pointInPolygon(pt, poly) {
    var inside = false;
    for (var i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      var xi = poly[i].x, yi = poly[i].y, xj = poly[j].x, yj = poly[j].y;
      var intersect = ((yi > pt.y) !== (yj > pt.y)) &&
        (pt.x < (xj - xi) * (pt.y - yi) / (yj - yi) + xi);
      if (intersect) inside = !inside;
    }
    return inside;
  }

  function closeLoop() {
    if (state.path.length < 3) return;
    var poly = state.path.map(function (i) { return DOTS[i]; });
    // close visually back to first dot
    drawLine(DOTS[state.path[state.path.length - 1]], DOTS[state.path[0]], document.getElementById('net-wrap'));

    var newlyCaught = 0;
    state.drops.forEach(function (drop) {
      if (drop.caught) return;
      if (pointInPolygon({ x: drop.x, y: drop.y }, poly)) {
        drop.caught = true;
        drop.el.classList.add('caught');
        newlyCaught++;
      }
    });
    state.caught += newlyCaught;
    document.getElementById('catch-count').textContent = state.caught;

    var msg = document.getElementById('net-msg');
    msg.textContent = newlyCaught > 0
      ? ('🎉 לכדתם ' + newlyCaught + ' טיפות בצורה הזו!')
      : 'הצורה הזו יצאה ריקה — נסו לסגור צורה במקום אחר!';

    clearPath();

    if (state.caught >= state.target) {
      msg.textContent = '🍯 מעולה! הרשת שלכם לכדה מספיק טיפות — הריבה נהיית סמיכה!';
      document.getElementById('close-net-btn').style.display = 'none';
      document.querySelector('.lab-btn.ghost').style.display = 'none';
      document.getElementById('net-continue-btn').style.display = 'block';
    }
  }

  function spawnDrops(wrap) {
    state.drops = [];
    var seed = 7;
    function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
    for (var i = 0; i < state.totalDrops; i++) {
      var d = { x: 10 + rnd() * 80, y: 10 + rnd() * 80, vx: (rnd() - 0.5) * 1.2, vy: (rnd() - 0.5) * 1.2, caught: false };
      var dropEl = el('div', 'drop', '💧');
      dropEl.style.left = d.x + '%';
      dropEl.style.top = d.y + '%';
      wrap.appendChild(dropEl);
      d.el = dropEl;
      state.drops.push(d);
    }
  }

  function stepDrops(wrap) {
    state.drops.forEach(function (d) {
      if (d.caught) return;
      d.x += d.vx * 0.3;
      d.y += d.vy * 0.3;
      if (d.x < 5 || d.x > 95) d.vx *= -1;
      if (d.y < 5 || d.y > 95) d.vy *= -1;
      d.x = Math.max(5, Math.min(95, d.x));
      d.y = Math.max(5, Math.min(95, d.y));
      d.el.style.left = d.x + '%';
      d.el.style.top = d.y + '%';
    });
  }

  // ── Screen 4: cold-plate measurement (writes _result) ──────────────
  function renderColdPlate() {
    setLevel(4, 'שלב 4 מתוך 4');
    root.innerHTML = '';
    root.appendChild(el('p', 'intro', 'בואו נבדוק על צלחת קרה — מטים כפית ריבה מכל סיר ורואים איזו זורמת פחות.'));

    var row = el('div', 'plate-row');
    var plates = [
      { id: 'a', label: 'תותים + תפוח', spread: false },
      { id: 'b', label: 'תותים בלבד', spread: true }
    ];
    plates.forEach(function (p) {
      var col = el('div', 'plate');
      var vis = el('div', 'plate-visual');
      var drop = el('div', 'jam-drop');
      vis.appendChild(drop);
      col.appendChild(vis);
      col.appendChild(el('div', 'plate-label', p.label));
      var verdict = el('div', 'plate-verdict');
      col.appendChild(verdict);
      row.appendChild(col);
      p._drop = drop; p._verdict = verdict;
    });
    root.appendChild(row);

    var btn = el('button', 'lab-btn primary', '⏱️ הטו את הצלחות');
    btn.onclick = function () {
      btn.disabled = true;
      plates.forEach(function (p) {
        if (p.spread) {
          p._drop.classList.add('spread');
          setTimeout(function () { p._verdict.textContent = '💧 עוד בישול'; p._verdict.style.color = '#C62839'; }, 1450);
        } else {
          setTimeout(function () { p._verdict.textContent = '✅ מוכנה!'; p._verdict.style.color = '#2E7D32'; }, 1450);
        }
      });
      setTimeout(function () {
        localStorage.setItem('stem_station' + STATION_NUM + '_result', 'a');
        var matchLine = el('p', 'intro',
          (state.prediction === 'a')
            ? '🎉 ניחשתם בדיוק! הריבה עם התפוח נשארה במקום — היא הסמיכה יותר.'
            : '🤔 יצא אחרת מהניחוש — הריבה עם התפוח היא זו שנשארה סמיכה!');
        matchLine.style.marginTop = '12px';
        root.appendChild(matchLine);
        var nextBtn = el('button', 'lab-btn primary', 'בואו נבין למה →');
        nextBtn.onclick = renderConclusion;
        root.appendChild(nextBtn);
      }, 1700);
    };
    root.appendChild(btn);
  }

  // ── Screen 5: conclusion (shared with notebook) ────────────────────
  function renderConclusion() {
    setLevel(5, 'סיכום');
    root.innerHTML = '';
    root.appendChild(el('p', 'intro', NB.conclusionQ));
    var row = el('div', 'opt-row');
    Object.keys(NB.conclusionCards).forEach(function (id) {
      var c = NB.conclusionCards[id];
      var card = el('div', 'opt-card', '<span class="opt-icon-wrap"><span class="opt-icon">' + c.icon + '</span></span><span class="opt-label">' + c.label + '</span>');
      card.onclick = function () {
        if (c.correct) {
          localStorage.setItem('stem_station' + STATION_NUM + '_conclusion', id);
          document.querySelectorAll('.opt-card').forEach(function (cc) { cc.classList.remove('picked', 'correct-pick', 'wrong'); });
          card.classList.add('picked', 'correct-pick');
          document.getElementById('conclusion-msg').textContent = '🎉 בדיוק! מצוין!';
          setTimeout(finishGame, 700);
        } else {
          card.classList.add('wrong');
          document.getElementById('conclusion-msg').textContent = '🤔 לא בדיוק — נסו שוב!';
          setTimeout(function () { card.classList.remove('wrong'); }, 500);
        }
      };
      row.appendChild(card);
    });
    root.appendChild(row);
    var msg = el('p', 'conclusion-msg', '');
    msg.id = 'conclusion-msg';
    root.appendChild(msg);
  }

  function finishGame() {
    localStorage.setItem('stem_game' + GAME_NUM + '_completed', '1');
    root.innerHTML = '';
    var done = el('div', 'lab-done');
    done.innerHTML =
      '<div class="lab-done-emoji">🎉</div>' +
      '<p class="lab-done-title">מעולה! גיליתם מה עושה ריבה סמיכה</p>' +
      '<button class="lab-btn primary" id="to-sorting-btn">🧩 בואו נרכיב את הניסוי</button>' +
