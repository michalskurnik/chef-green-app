<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<script src="../assets/rc-config.js"></script>
<script src="../assets/stem-config.js"></script>
<script src="access-guard.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Assistant:wght@700;800&display=swap" rel="stylesheet">
<title>מעבדת הסמיכות – ריבת תותים</title>
<style>
:root{ --c1:#C62839; --c2:#E0546B; }
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
*{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html{touch-action:pan-y;overscroll-behavior-y:none}
body{background:#F5F0DC;display:flex;justify-content:center;padding:16px 10px 36px;font-family:'Assistant',sans-serif;direction:rtl;min-height:100vh;overflow-x:hidden}
button{touch-action:manipulation;-webkit-appearance:none;font-family:inherit}

#app{width:100%;max-width:400px;background:#fff;border-radius:26px;box-shadow:0 12px 40px rgba(0,0,0,.13);overflow:hidden;animation:fadeUp .4s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

#hdr{padding:14px 18px 16px;color:#fff;text-align:center;background:linear-gradient(135deg,var(--c1),var(--c2));position:relative}
#level-badge{position:absolute;top:12px;left:14px;background:rgba(255,255,255,.25);border-radius:12px;padding:3px 10px;font-size:11px;font-weight:800;color:#fff}
#badge{display:inline-block;background:rgba(255,255,255,.22);border-radius:20px;padding:3px 14px;font-size:12px;font-weight:700;margin-bottom:6px}
#htitle{font-family:'Fredoka One',cursive;font-size:20px}

#root{padding:20px 20px 28px;min-height:52vh;display:flex;flex-direction:column;justify-content:center}
.intro{font-size:16px;font-weight:700;color:#444;text-align:center;margin-bottom:18px;line-height:1.6}
.note-line{font-size:13.5px;font-weight:700;color:#666;text-align:center;line-height:1.5;margin-bottom:10px}

/* Prediction / conclusion cards (shared look) */
.opt-row{display:flex;flex-direction:column;gap:14px;margin-top:4px}
.opt-card{position:relative;display:flex;align-items:center;gap:16px;background:#f7f7f7;border:2px solid #eee;border-radius:20px;padding:16px 20px;cursor:pointer;transition:all .2s}
.opt-card:active{transform:scale(.98)}
.opt-card.picked{border-color:var(--c1);background:rgba(0,0,0,.02)}
.opt-card.correct-pick{border-color:#F7C948;background:rgba(247,201,72,.15)}
.opt-card.wrong{animation:cardShake .4s ease;border-color:#EF5350}
@keyframes cardShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.conclusion-msg{min-height:20px;font-size:14px;font-weight:700;color:#7a5c1e;text-align:center;margin-top:2px}
.opt-icon-wrap{position:relative;flex-shrink:0;width:58px;height:58px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.12);overflow:hidden}
.opt-icon-wrap img{position:absolute;object-fit:contain}
.opt-icon-wrap img.node-apple{width:34px;height:34px;top:6px;left:6px}
.opt-icon-wrap img.node-strawberry{width:34px;height:34px;bottom:6px;right:6px}
.opt-icon-wrap img.node-solo{width:44px;height:44px;top:7px;left:7px}
.opt-icon{font-size:30px;position:relative;z-index:1}
.opt-label{font-size:15px;font-weight:700;color:#333}

.lab-btn{display:block;width:100%;border:none;border-radius:18px;padding:14px;font-size:16px;font-family:'Fredoka One',cursive;cursor:pointer;margin-top:14px;transition:opacity .2s,transform .1s}
.lab-btn:active{transform:scale(.97)}
.lab-btn.primary{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;box-shadow:0 5px 18px rgba(0,0,0,.18)}
.lab-btn.primary:disabled{opacity:.4;pointer-events:none}
.lab-btn.ghost{background:none;color:#999;box-shadow:none;font-family:'Assistant',sans-serif;font-weight:800;font-size:13px;text-decoration:underline}

/* Step 1: tap the 4 ingredients — no wrong answer */
.ing-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:6px 0 4px}
.ing-card{position:relative;background:#f7f7f7;border:2px dashed #ddd;border-radius:18px;padding:20px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:all .2s}
.ing-card:active{transform:scale(.96)}
.ing-card.checked{border:2px solid var(--c1);background:rgba(198,40,57,.06)}
.ing-emoji{font-size:36px}
.ing-label{font-size:14px;font-weight:800;color:#333}
.ing-check{position:absolute;top:8px;left:8px;width:24px;height:24px;border-radius:50%;background:#4CAF50;color:#fff;font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.5);transition:all .25s}
.ing-card.checked .ing-check{opacity:1;transform:scale(1)}

/* Pectin reveal panel */
.reveal-box{display:flex;flex-direction:column;align-items:center;gap:8px;padding:24px 10px;background:linear-gradient(135deg,#fff7e0,#ffe9c2);border-radius:20px;margin:10px 0}
.reveal-emoji{font-size:54px;animation:pulseReveal 1.2s ease-in-out infinite}
@keyframes pulseReveal{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.reveal-word{font-family:'Fredoka One',cursive;font-size:24px;color:#a15b00}

/* Step 2: squish game */
.squish-row{display:flex;gap:16px;justify-content:center;margin:6px 0 4px}
.squish-card{flex:1;max-width:150px;background:#f7f7f7;border:2px solid #eee;border-radius:18px;padding:18px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:border-color .2s,transform .15s}
.squish-card:active{transform:scale(.96)}
.squish-card.picked{border-color:var(--c1)}
.squish-emoji{font-size:48px;transition:transform .5s ease;display:inline-block}
.squish-card[data-id="apple"].squished .squish-emoji{transform:scaleY(.88) scaleX(1.06)}
.squish-card[data-id="strawberry"].squished .squish-emoji{transform:scaleY(.3) scaleX(1.45)}
.squish-label{font-size:14px;font-weight:800;color:#333}
.squish-result{font-size:12px;font-weight:700;text-align:center;min-height:32px;color:#555}

/* Step 3: pot ingredients */
.pot-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;margin:4px 0 12px}
.pot-visual{position:relative;width:120px;height:92px}
.pot-visual img{width:100%;height:100%;object-fit:contain}
.pot-items-in{position:absolute;bottom:40%;left:50%;transform:translateX(-50%);font-size:18px;letter-spacing:2px}
#pot-count{font-size:13px;font-weight:800;color:#999}
.ing-choice-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:6px}
.ing-choice{position:relative;background:#f7f7f7;border:2px dashed #ddd;border-radius:16px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;transition:all .2s}
.ing-choice:active{transform:scale(.94)}
.ing-choice.added{border-style:solid;border-color:#4CAF50;background:rgba(76,175,80,.08);opacity:.5;pointer-events:none}
.ing-choice.wrong{animation:cardShake .4s ease;border-color:#EF5350}
.ing-choice-emoji{font-size:26px}
.ing-choice-label{font-size:11px;font-weight:800;color:#555;text-align:center;line-height:1.25}

/* Step 4: thermometer drag */
.therm-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;margin:14px 0}
.therm-readout{font-family:'Fredoka One',cursive;font-size:34px;color:var(--c1)}
.therm-slider{-webkit-appearance:none;appearance:none;width:82%;height:16px;border-radius:8px;background:linear-gradient(90deg,#9fd8ef,#F7C948,#EF5350);outline:none}
.therm-slider::-webkit-slider-thumb{-webkit-appearance:none;width:36px;height:36px;border-radius:50%;background:#fff;border:4px solid var(--c1);box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer}
.therm-slider::-moz-range-thumb{width:36px;height:36px;border-radius:50%;background:#fff;border:4px solid var(--c1);box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer;border:4px solid var(--c1)}
.therm-target-note{font-size:14px;font-weight:800;color:#999;min-height:20px}

.lab-done{display:flex;flex-direction:column;align-items:center;padding:16px 4px}
.lab-done-emoji{font-size:44px;margin-bottom:8px}
.lab-done-title{font-family:'Fredoka One',cursive;font-size:17px;color:#333;text-align:center;margin-bottom:6px}

@media(min-width:420px){ #app{max-width:440px} }
</style>
</head>
<body>
<div id="app">
  <header id="hdr">
    <span id="level-badge"></span>
    <div id="badge">🍓 ריבת תותים</div>
    <h2 id="htitle">🍓 מעבדת הסמיכות</h2>
  </header>
  <div id="root"></div>
</div>

<script src="unlock-logic.js"></script>
<script src="../assets/stem-notebook-config.js"></script>
<script>
(function () {
  'use strict';

  // Full pedagogical redesign (Asana 1218988523010841) - replaces the old
  // "connect-net" catching game entirely with 4 short, concrete steps that
  // build up to "what is pectin": tap the 4 ingredients -> squish apple vs
  // strawberry -> choose what goes in the pot -> heat to 100°. The opening
  // guess screen and the closing conclusion screen are unchanged and still
  // read/write the exact same NOTEBOOK_STATIONS ids, so מחברת המדען keeps
  // working without any changes there.

  var STATION_NUM = 2; // ריבת תותים = index 1 in NOTEBOOK_STATIONS
  var NB = StemNotebookConfig.NOTEBOOK_STATIONS[STATION_NUM - 1];
  var GAME_NUM = 3;
  var TOTAL_STEPS = 6;
  var root = document.getElementById('root');
  var levelBadge = document.getElementById('level-badge');

  var state = { prediction: null, checked: [], potAdded: [] };

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html !== undefined) e.innerHTML = html;
    return e;
  }

  function setLevel(n, custom) {
    levelBadge.textContent = custom || ('שלב ' + n + ' מתוך ' + TOTAL_STEPS);
  }

  // Illustration for the two prediction cards: 'a' = strawberries + apple
  // (pectin network), 'b' = strawberries only - reuses the existing
  // stem_prop_node_* assets rather than plain emoji.
  function predIconHtml(id, icon) {
    if (id === 'a') {
      return '<span class="opt-icon-wrap"><img class="node-apple" src="assets/props/stem_prop_node_apple.png" alt=""><img class="node-strawberry" src="assets/props/stem_prop_node_strawberry.png" alt=""></span>';
    }
    if (id === 'b') {
      return '<span class="opt-icon-wrap"><img class="node-solo" src="assets/props/stem_prop_node_strawberry.png" alt=""></span>';
    }
    return '<span class="opt-icon-wrap"><span class="opt-icon">' + icon + '</span></span>';
  }

  // ── Step 0: prediction (kept - feeds stem_station2_prediction, unchanged
  // question/cards, only the destination screen changed) ────────────────
  function renderPrediction() {
    setLevel(1);
    root.innerHTML = '';
    root.appendChild(el('p', 'intro', NB.predictionQ));
    var row = el('div', 'opt-row');
    Object.keys(NB.cards).forEach(function (id) {
      var c = NB.cards[id];
      var card = el('div', 'opt-card', predIconHtml(id, c.icon) + '<span class="opt-label">' + c.label + '</span>');
      card.onclick = function () {
        state.prediction = id;
        localStorage.setItem('stem_station' + STATION_NUM + '_prediction', id);
        document.querySelectorAll('.opt-card').forEach(function (cc) { cc.classList.remove('picked'); });
        card.classList.add('picked');
        setTimeout(renderIngredients, 400);
      };
      row.appendChild(card);
    });
    root.appendChild(row);
  }

  // ── Step 1: tap the 4 ingredients - no wrong answer, just discovery ──
  var INGREDIENTS = [
    { id: 'pectin', emoji: '❓', label: 'פקטין' },
    { id: 'heat', emoji: '🔥', label: 'חום' },
    { id: 'sugar', emoji: '🍬', label: 'סוכר' },
    { id: 'acid', emoji: '🍋', label: 'חומצה' }
  ];
  function renderIngredients() {
    setLevel(2);
    root.innerHTML = '';
    root.appendChild(el('p', 'intro', 'מה צריך כדי להכין ריבה? הקישו על כל המרכיבים — אין כאן תשובה לא נכונה, פשוט גלו את כולם!'));
    state.checked = [];
    var grid = el('div', 'ing-grid');
    INGREDIENTS.forEach(function (ing) {
      var card = el('div', 'ing-card',
        '<span class="ing-emoji">' + ing.emoji + '</span><span class="ing-label">' + ing.label + '</span><span class="ing-check">✓</span>');
      card.onclick = function () {
        if (card.classList.contains('checked')) return;
        card.classList.add('checked');
        state.checked.push(ing.id);
        if (state.checked.length === INGREDIENTS.length) {
          setTimeout(renderPectinReveal, 500);
        }
      };
      grid.appendChild(card);
    });
    root.appendChild(grid);
  }

  function renderPectinReveal() {
    root.innerHTML = '';
    root.appendChild(el('p', 'intro', 'מצוין, כל המרכיבים מסומנים! אבל אחד מהם עדיין מסתורי...'));
    root.appendChild(el('div', 'reveal-box', '<div class="reveal-emoji">🫙</div><div class="reveal-word">פקטין?</div>'));
    root.appendChild(el('p', 'note-line', 'בשלב הבא נגלה מה זה פקטין!'));
    var btn = el('button', 'lab-btn primary', 'בואו נגלה →');
    btn.onclick = renderSquish;
    root.appendChild(btn);
  }

  // ── Step 2: squish game (apple vs strawberry) → explains pectin ──────
  var SQUISH_ORDER = ['apple', 'strawberry'];
  var SQUISH = {
    apple: { emoji: '🍎', label: 'תפוח', resultText: 'קשיח — כמעט לא נמעך!' },
    strawberry: { emoji: '🍓', label: 'תות', resultText: 'רך — נמעך כמעט לגמרי!' }
  };
  function renderSquish() {
    setLevel(3);
    root.innerHTML = '';
    root.appendChild(el('p', 'intro', 'איזה פרי יימעך יותר אם נלחץ עליו? נחשו, ואז נבדוק ביחד!'));
    var row = el('div', 'squish-row');
    SQUISH_ORDER.forEach(function (id) {
      var f = SQUISH[id];
      var card = el('div', 'squish-card',
        '<span class="squish-emoji">' + f.emoji + '</span><span class="squish-label">' + f.label + '</span><span class="squish-result"></span>');
      card.dataset.id = id;
      card.onclick = function () {
        if (state.squishPicked) return;
        state.squishPicked = true;
        document.querySelectorAll('.squish-card').forEach(function (c) { c.classList.remove('picked'); });
        card.classList.add('picked');
        setTimeout(function () { runSquishDemo(id); }, 400);
      };
      row.appendChild(card);
    });
    root.appendChild(row);
  }

  function runSquishDemo(pickedId) {
    var cards = document.querySelectorAll('.squish-card');
    cards.forEach(function (card) {
      var id = card.dataset.id;
      card.classList.add('squished');
      card.querySelector('.squish-result').textContent = SQUISH[id].emoji + ' ' + SQUISH[id].resultText;
    });
    setTimeout(function () {
      var matchLine = el('p', 'intro', pickedId === 'strawberry'
        ? '🎉 ניחשתם נכון! התות נמעך הכי הרבה.'
        : '🤔 יצא אחרת — התות הוא זה שנמעך הכי הרבה!');
      root.appendChild(matchLine);
      root.appendChild(el('p', 'note-line', '🍏 בפירות כמו תפוח ואשכולית יש הרבה פקטין בקליפה שעוזר להם להיות קשיחים, לעומת תות וענבים שיש בהם מעט פקטין.'));
      var note = el('p', 'note-line', 'קליפות תפוח מביאות המון פקטין ועוזרות לתות להפוך לריבה במרקם ג\'לי!');
      note.style.fontWeight = '800';
      note.style.color = '#a15b00';
      root.appendChild(note);
      var btn = el('button', 'lab-btn primary', 'בואו נכין ריבה! →');
      btn.onclick = renderPot;
      root.appendChild(btn);
    }, 1200);
  }

  // ── Step 3: choose what goes in the pot ──────────────────────────────
  var POT_CORRECT = [
    { id: 'sugar', emoji: '🍬', label: 'סוכר' },
    { id: 'strawberries', emoji: '🍓', label: 'תותים' },
    { id: 'lemon', emoji: '🍋', label: 'לימון' },
    { id: 'apple', emoji: '🍎', label: 'תפוח (עם הקליפה)' }
  ];
  var POT_DECOYS = [
    { id: 'salt', emoji: '🧂', label: 'מלח' },
    { id: 'cucumber', emoji: '🥒', label: 'מלפפון' },
    { id: 'oil', emoji: '🫒', label: 'שמן' }
  ];
  function renderPot() {
    setLevel(4);
    root.innerHTML = '';
    root.appendChild(el('p', 'intro', 'מה נכנס לסיר כדי להכין ריבה? הקישו על המרכיבים הנכונים!'));
    state.potAdded = [];

    var potWrap = el('div', 'pot-wrap');
    var potVis = el('div', 'pot-visual', '<img src="assets/props/stem_prop_pot_top.png" alt=""><span class="pot-items-in" id="pot-items-in"></span>');
    potWrap.appendChild(potVis);
    var potCount = el('div', '', '0 מתוך ' + POT_CORRECT.length + ' מרכיבים בסיר');
    potCount.id = 'pot-count';
    potWrap.appendChild(potCount);
    root.appendChild(potWrap);

    var all = POT_CORRECT.concat(POT_DECOYS)
      .map(function (item) { return { item: item, sort: Math.sin((item.id.length + 1) * 999) }; })
      .sort(function (a, b) { return a.sort - b.sort; })
      .map(function (w) { return w.item; });

    var grid = el('div', 'ing-choice-grid');
    all.forEach(function (item) {
      var correct = POT_CORRECT.indexOf(item) > -1;
      var card = el('div', 'ing-choice',
        '<span class="ing-choice-emoji">' + item.emoji + '</span><span class="ing-choice-label">' + item.label + '</span>');
      card.onclick = function () {
        if (card.classList.contains('added')) return;
        if (correct) {
          card.classList.add('added');
          state.potAdded.push(item.id);
          document.getElementById('pot-items-in').insertAdjacentHTML('beforeend', item.emoji);
          document.getElementById('pot-count').textContent = state.potAdded.length + ' מתוך ' + POT_CORRECT.length + ' מרכיבים בסיר';
          if (state.potAdded.length === POT_CORRECT.length) {
            setTimeout(showPotMatch, 500);
          }
        } else {
          card.classList.remove('wrong');
          void card.offsetWidth;
          card.classList.add('wrong');
          setTimeout(function () { card.classList.remove('wrong'); }, 500);
        }
      };
      grid.appendChild(card);
    });
    root.appendChild(grid);
  }

  function showPotMatch() {
    localStorage.setItem('stem_station' + STATION_NUM + '_result', 'a');
    var matchLine = el('p', 'intro', (state.prediction === 'a')
      ? '🎉 ניחשתם בדיוק! ריבה עם תפוח וקליפותיו יוצאת סמיכה יותר.'
      : '🤔 יצא אחרת מהניחוש — ריבה עם תפוח וקליפותיו היא זו שיוצאת סמיכה יותר!');
    matchLine.style.marginTop = '4px';
    root.appendChild(matchLine);
    var btn = el('button', 'lab-btn primary', 'עכשיו מחממים! →');
    btn.onclick = renderThermometer;
    root.appendChild(btn);
  }

  // ── Step 4: drag the thermometer to boiling (100°) ──────────────────
  function renderThermometer() {
    setLevel(5);
    root.innerHTML = '';
    root.appendChild(el('p', 'intro', 'פקטין משתחרר מהפירות רק ברתיחה! גררו את המדחום עד 100° כדי להביא את הסיר לרתיחה.'));

    var wrap = el('div', 'therm-wrap');
    var readout = el('div', 'therm-readout', '25°');
    wrap.appendChild(readout);

    var slider = el('input', 'therm-slider');
    slider.type = 'range';
    slider.min = '25';
    slider.max = '100';
    slider.value = '25';
    wrap.appendChild(slider);

    var note = el('div', 'therm-target-note', 'גררו את המחוון עד 100°');
    wrap.appendChild(note);
    root.appendChild(wrap);

    var btn = el('button', 'lab-btn primary', 'המשיכו →');
    btn.disabled = true;
    btn.onclick = renderConclusion;
    root.appendChild(btn);

    slider.addEventListener('input', function () {
      var v = parseInt(slider.value, 10);
      if (v >= 97) {
        slider.value = '100';
        v = 100;
        note.textContent = '🌡️ 💯 רתיחה! מעולה!';
        note.style.color = '#2E7D32';
        btn.disabled = false;
      } else {
        note.textContent = 'גררו את המחוון עד 100°';
        note.style.color = '#999';
        btn.disabled = true;
      }
      readout.textContent = v + '°';
    });
  }

  // ── Step 5: conclusion (shared with the notebook, unchanged) ─────────
  function renderConclusion() {
    setLevel(6, 'סיכום');
    root.innerHTML = '';
    root.appendChild(el('p', 'intro', NB.conclusionQ));
    var row = el('div', 'opt-row');
    Object.keys(NB.conclusionCards).forEach(function (id) {
      var c = NB.conclusionCards[id];
      var card = el('div', 'opt-card', '<span class="opt-icon-wrap"><span class="opt-icon">' + c.icon + '</span></span><span class="opt-label">' + c.label + '</span>');
      card.onclick = function () {
        if (c.correct) {
          localStorage.setItem('stem_station' + STATION_NUM + '_conclusion', id);
          document.querySelectorAll('.opt-card').forEach(function (cc) { cc.classList.remove('picked', 'correct-pick', 'wrong'); });
          card.classList.add('picked', 'correct-pick');
          document.getElementById('conclusion-msg').textContent = '🎉 בדיוק! מצוין!';
          setTimeout(finishGame, 700);
        } else {
          card.classList.add('wrong');
          document.getElementById('conclusion-msg').textContent = '🤔 לא בדיוק — נסו שוב!';
          setTimeout(function () { card.classList.remove('wrong'); }, 500);
        }
      };
      row.appendChild(card);
    });
    root.appendChild(row);
    var msg = el('p', 'conclusion-msg', '');
    msg.id = 'conclusion-msg';
    root.appendChild(msg);
  }

  function finishGame() {
    localStorage.setItem('stem_game' + GAME_NUM + '_completed', '1');
    root.innerHTML = '';
    var done = el('div', 'lab-done');
    done.innerHTML =
      '<div class="lab-done-emoji">🎉</div>' +
      '<p class="lab-done-title">מעולה! גיליתם מה עושה ריבה סמיכה</p>' +
      '<button class="lab-btn primary" id="to-sorting-btn">🧩 בואו נרכיב את הניסוי</button>' +
      '<button class="lab-btn ghost" id="to-hub-btn">🏠 חזרה להאב</button>';
    root.appendChild(done);
    document.getElementById('to-sorting-btn').onclick = function () { window.location.href = 'game4.html'; };
    document.getElementById('to-hub-btn').onclick = function () { window.location.href = 'index.html'; };
  }

  document.addEventListener('DOMContentLoaded', renderPrediction);
})();
</script>
</body>
</html>
