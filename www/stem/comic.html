<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ניסויים במטבח 🧪</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Rubik:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
*{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{
  width:100%;height:100%;
  background:#12332B;
  overflow:hidden;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}

/* ── Layout ── */
#screen{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-between;
  padding:env(safe-area-inset-top,12px) 16px env(safe-area-inset-bottom,20px);
  position:relative;
}

/* ── Top bar ── */
#top-bar{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  padding-top:4px;
  flex-shrink:0;
}
#counter{
  font-family:'Rubik',sans-serif;
  font-size:15px;
  font-weight:700;
  color:rgba(255,255,255,.75);
  letter-spacing:.5px;
  direction:ltr;unicode-bidi:isolate; /* "1 / 6" must not bidi-reverse under the page's RTL direction */
}
#skip-btn{
  position:absolute;
  left:0;
  background:rgba(255,255,255,.12);
  border:none;
  border-radius:20px;
  color:rgba(255,255,255,.7);
  font-family:'Rubik',sans-serif;
  font-size:14px;
  font-weight:700;
  padding:7px 16px;
  cursor:pointer;
  touch-action:manipulation;
  transition:background .15s;
}
#skip-btn:active{background:rgba(255,255,255,.22)}

/* ── Panel area ── */
#panel-area{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  min-height:0;
  padding:8px 0;
}
#panel-wrap{
  position:relative;
  width:100%;
  max-width:480px;
  height:75vh;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 8px 32px rgba(0,0,0,.5);
  cursor:pointer;
}
#panel-img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  border-radius:20px;
  transition:opacity .25s ease;
}

/* ── Text overlay (1-3 words per bubble, per spec) ── */
#panel-text{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  background:#F5F0DC;
  padding:14px 18px;
  font-family:'Fredoka One',cursive;
  font-size:clamp(18px,5.5vw,24px);
  color:#12332B;
  text-align:center;
  line-height:1.4;
  direction:rtl;
  border-radius:0 0 20px 20px;
}

/* ── CTA button (last panel only) ── */
#cta-btn{
  display:none;
  width:100%;
  max-width:320px;
  background:#F5921E;
  color:#fff;
  border:none;
  border-radius:50px;
  padding:18px 28px;
  font-family:'Fredoka One',cursive;
  font-size:22px;
  text-align:center;
  cursor:pointer;
  box-shadow:0 4px 20px rgba(245,146,30,.5);
  touch-action:manipulation;
  transition:transform .1s,opacity .15s;
  margin-top:8px;
  flex-shrink:0;
}
#cta-btn:active{transform:scale(.97);opacity:.9}

/* ── Progress dots ── */
#dots{
  display:flex;
  gap:8px;
  justify-content:center;
  align-items:center;
  padding-bottom:4px;
  flex-shrink:0;
}
.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:rgba(255,255,255,.3);
  transition:background .25s, transform .25s;
}
.dot.active{
  background:#F5921E;
  transform:scale(1.35);
}

/* ── iPad ── */
@media(min-width:768px){
  #panel-wrap{max-width:560px}
  #panel-text{font-size:26px;padding:18px 24px}
  #cta-btn{font-size:26px;padding:20px 36px}
}
</style>
</head>
<body>
<div id="screen">

  <!-- Top bar -->
  <div id="top-bar">
    <div id="counter">1 / 6</div>
    <button id="skip-btn" onclick="skipAll()">דלג</button>
  </div>

  <!-- Panel -->
  <div id="panel-area">
    <div id="panel-wrap" onclick="nextPanel()">
      <img id="panel-img" src="assets/comic/comic_panel1.png" alt="פאנל 1">
      <div id="panel-text">מחברת ריקה?!</div>
    </div>
  </div>

  <!-- CTA button (last panel) -->
  <button id="cta-btn" onclick="goNext()">מתחילים לחקור! 🧪</button>

  <!-- Dots -->
  <div id="dots">
    <div class="dot active" id="dot-0"></div>
    <div class="dot" id="dot-1"></div>
    <div class="dot" id="dot-2"></div>
    <div class="dot" id="dot-3"></div>
    <div class="dot" id="dot-4"></div>
    <div class="dot" id="dot-5"></div>
  </div>

</div>

<script>
(function(){
  'use strict';

  // Captions kept to 1-3 words per the package spec ("הטקסט מוגבל לבועות
  // של 1-3 מילים") - scenes themselves are per the spec's panel table.
  var PANELS = [
    { img: 'assets/comic/comic_panel1.png', text: 'מחברת ריקה?!' },
    { img: 'assets/comic/comic_panel2.png', text: 'למה תופח?' },
    { img: 'assets/comic/comic_panel3.png', text: 'מצרכים מגיעים!' },
    { img: 'assets/comic/comic_panel4.png', text: 'בואו נבדוק!' },
    { img: 'assets/comic/comic_panel5.png', text: '4 תחנות מחכות' },
    { img: 'assets/comic/comic_panel6.png', text: 'מוכנים, מדענים?' }
  ];

  var current = 0;
  var img     = document.getElementById('panel-img');
  var txt     = document.getElementById('panel-text');
  var counter = document.getElementById('counter');
  var ctaBtn  = document.getElementById('cta-btn');

  // Preload all images
  PANELS.forEach(function(p){ var i = new Image(); i.src = p.img; });

  function goTo(idx) {
    if (idx >= PANELS.length) { goNext(); return; }
    current = idx;
    var p = PANELS[idx];

    img.style.opacity = '0';
    setTimeout(function(){
      img.src = p.img;
      img.onload = function(){ img.style.opacity = '1'; };
      if (img.complete) img.style.opacity = '1';
    }, 120);

    txt.textContent = p.text;
    counter.textContent = (idx + 1) + ' / ' + PANELS.length;

    document.querySelectorAll('.dot').forEach(function(d, i){
      d.classList.toggle('active', i === idx);
    });

    if (idx === PANELS.length - 1) {
      ctaBtn.style.display = 'block';
      document.getElementById('panel-wrap').onclick = null;
    } else {
      ctaBtn.style.display = 'none';
      document.getElementById('panel-wrap').onclick = nextPanel;
    }
  }

  window.nextPanel = function() {
    if (current < PANELS.length - 1) goTo(current + 1);
  };

  window.skipAll = function() {
    window.location.href = 'index.html';
  };

  window.goNext = function() {
    window.location.href = 'index.html';
  };

  // Swipe support
  var touchStartX = 0;
  document.addEventListener('touchstart', function(e){
    touchStartX = e.touches[0].clientX;
  }, {passive:true});
  document.addEventListener('touchend', function(e){
    var dx = touchStartX - e.changedTouches[0].clientX;
    if (Math.abs(dx) > 40) {
      if (dx > 0) nextPanel();  // swipe left = next
    }
  }, {passive:true});

  goTo(0);
})();
</script>
</body>
</html>
