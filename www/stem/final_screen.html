<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<script src="../assets/rc-config.js"></script>
<script src="../assets/stem-config.js"></script>
<script src="access-guard.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>סיימתם את הניסויים במטבח! 🎉</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Assistant:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{min-height:100%;background:#12332B;font-family:'Assistant',sans-serif;direction:rtl;-webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column;align-items:center;overflow-y:auto;overflow-x:hidden;position:relative;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px)}

:root{
  --green-deep:#12332B;
  --green-mid:#2E7D32;
  --gold:#F7C948;
  --gold-deep:#F5921E;
  --cream:#F5F0DC;
}

@keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(2deg)}}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 6px 28px rgba(245,146,30,.45)}50%{transform:scale(1.04);box-shadow:0 12px 38px rgba(245,146,30,.72)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes shimmer{0%{background-position:200% center}100%{background-position:-200% center}}
@keyframes badgeGlow{0%,100%{filter:drop-shadow(0 0 16px rgba(247,201,72,.55)) drop-shadow(0 8px 20px rgba(0,0,0,.25))}50%{filter:drop-shadow(0 0 30px rgba(247,201,72,.85)) drop-shadow(0 8px 28px rgba(0,0,0,.3))}}
@keyframes badgeBounce{0%{transform:translateY(-50px) scale(.7);opacity:0}60%{transform:translateY(6px) scale(1.05)}80%{transform:translateY(-3px) scale(.98)}100%{transform:translateY(0) scale(1);opacity:1}}
@keyframes sparkle{0%,100%{opacity:0;transform:scale(0) rotate(0)}50%{opacity:1;transform:scale(1) rotate(180deg)}}
@keyframes cardReveal{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes bonusPop{0%{transform:scale(.5) rotate(-10deg);opacity:0}70%{transform:scale(1.1) rotate(4deg)}100%{transform:scale(1) rotate(0);opacity:1}}

.page{width:100%;max-width:420px;padding:0 20px}

/* ── Sparkle layer ── */
.sparkles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.sp{position:absolute;width:6px;height:6px;background:var(--gold);
    clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
    animation:sparkle ease-in-out infinite}

/* ── Hero banner ── */
#hero{
  width:100%;max-width:420px;
  background:var(--cream);
  border-radius:0 0 40px 40px;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 24px 14px;
  text-align:center;position:relative;overflow:hidden;
  box-shadow:0 12px 44px rgba(0,0,0,.38);
  animation:fadeUp .5s ease both;
  z-index:1;
}
#hero::after{
  content:'';position:absolute;top:0;left:0;right:0;height:6px;
  background:linear-gradient(90deg,var(--green-mid) 33%,var(--gold) 33%,var(--gold) 66%,#D9531E 66%);
}

.confetti{position:absolute;pointer-events:none;font-size:20px;animation:float ease-in-out infinite}

.badge-wrap{
  position:relative;width:84px;height:84px;
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 2px;
  animation:badgeBounce .9s cubic-bezier(.22,.61,.36,1) .1s both;
}
.badge-ring{
  position:absolute;inset:-8px;border-radius:50%;
  background:conic-gradient(from 0deg,rgba(247,201,72,.6),rgba(247,201,72,0),rgba(247,201,72,.6),rgba(247,201,72,0),rgba(247,201,72,.6));
  animation:shimmer 4s linear infinite;filter:blur(3px);
}
#trophy-icon{
  font-size:48px;line-height:1;position:relative;z-index:1;display:block;
  animation:pop .6s ease .1s both,badgeGlow 3s ease-in-out infinite;
}

#hero-title{font-family:'Fredoka One',cursive;font-size:19px;color:var(--green-deep);line-height:1.15;margin-bottom:4px}
#hero-sub{font-size:13px;font-weight:700;color:rgba(18,51,43,.62);line-height:1.3}

/* ── Twist section ── */
#twist{
  width:100%;max-width:420px;padding:8px 0 0;
  display:flex;flex-direction:column;align-items:center;
  position:relative;z-index:1;
  animation:fadeUp .5s .3s both ease;
}
.twist-bubble{
  background:linear-gradient(135deg,var(--green-mid),#4CAF50);
  border-radius:18px;padding:9px 18px;text-align:center;
  box-shadow:0 4px 20px rgba(0,0,0,.25);width:100%;
}
.twist-text{
  font-family:'Fredoka One',cursive;font-size:16px;color:#fff;line-height:1.2;
}

/* ── Scientist's notebook: sticker grid ── */
#notebook{
  width:100%;max-width:420px;padding:12px 0 0;position:relative;z-index:1;
  animation:fadeUp .5s .2s both ease;
}
.notebook-page{
  background:var(--cream);border-radius:20px;
  padding:18px 16px 16px;position:relative;overflow:hidden;
  box-shadow:0 10px 34px rgba(0,0,0,.3);
}
.notebook-page::before{
  content:'';position:absolute;top:0;bottom:0;right:50%;width:4px;
  background:linear-gradient(180deg,transparent,rgba(18,51,43,.18) 15%,rgba(18,51,43,.18) 85%,transparent);
  box-shadow:0 0 6px rgba(18,51,43,.15);
}
#notebook-title{
  font-family:'Fredoka One',cursive;font-size:16px;color:var(--green-deep);
  text-align:center;margin-bottom:10px;
}
.sticker-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sticker-slot{
  aspect-ratio:1;border-radius:16px;display:flex;align-items:center;justify-content:center;
  opacity:0;animation:cardReveal .45s ease both;position:relative;
}
.sticker-slot img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 3px 8px rgba(0,0,0,.2))}
.sticker-slot.locked img{filter:grayscale(1) opacity(.35)}
.sticker-slot .lock-mark{
  position:absolute;font-size:22px;opacity:.55;
}
.bonus-sticker{
  margin-top:12px;display:flex;flex-direction:column;align-items:center;
  animation:bonusPop .5s ease .2s both;
}
.bonus-sticker img{width:120px;height:120px;object-fit:contain;filter:drop-shadow(0 4px 14px rgba(247,201,72,.55))}
.bonus-label{
  font-family:'Fredoka One',cursive;font-size:13px;color:var(--gold-deep);
  background:rgba(245,146,30,.12);border-radius:12px;padding:4px 12px;margin-top:4px;
}

/* ── CTAs ── */
#actions{
  width:100%;max-width:420px;padding:14px 0 0;
  display:flex;flex-direction:column;gap:8px;
  position:relative;z-index:1;
  animation:fadeUp .5s .25s both ease;
}
.btn-primary{
  width:100%;background:linear-gradient(135deg,#F5921E,#F7C948);
  color:#fff;border:none;border-radius:20px;padding:15px 24px;
  font-size:18px;font-family:'Fredoka One',cursive;cursor:pointer;
  box-shadow:0 6px 28px rgba(245,146,30,.5);
  animation:pulse 2.5s ease-in-out infinite;
  touch-action:manipulation;position:relative;overflow:hidden;
}
.btn-primary::before{
  content:'';position:absolute;top:-50%;right:-60%;width:80px;height:200%;
  background:rgba(255,255,255,.15);transform:skewX(-20deg);
  animation:shimmer 2.5s ease-in-out infinite;
}
.btn-primary:active{transform:scale(.97);animation:none}
.btn-secondary{
  width:100%;background:rgba(245,240,220,.09);color:rgba(245,240,220,.85);
  border:2px solid rgba(245,240,220,.25);border-radius:18px;padding:12px 10px;
  font-size:15px;font-weight:800;font-family:'Assistant',sans-serif;
  cursor:pointer;touch-action:manipulation;
}
.btn-secondary:active{opacity:.7}

/* ── iPad ── */
@media(min-width:768px){
  .page,#hero,#twist,#notebook,#actions{max-width:520px}
}
</style>
</head>
<body>

<div class="sparkles" id="sparkles"></div>

<div id="hero">
  <div class="confetti" style="top:18px;right:24px;animation-duration:2.2s;animation-delay:0s">🎉</div>
  <div class="confetti" style="top:22px;left:28px;animation-duration:2.8s;animation-delay:.3s">🧪</div>
  <div class="confetti" style="bottom:32px;right:44px;animation-duration:2.4s;animation-delay:.6s">⭐</div>
  <div class="confetti" style="bottom:28px;left:38px;animation-duration:2s;animation-delay:.1s">🔬</div>

  <div class="badge-wrap">
    <div class="badge-ring"></div>
    <span id="trophy-icon">🏆</span>
  </div>
  <h1 id="hero-title">כל הכבוד!<br>סיימתם את הניסויים במטבח!</h1>
  <p id="hero-sub">גיליתם 4 תגליות מדעיות מהמטבח</p>
</div>

<div class="page">
  <div id="twist">
    <div class="twist-bubble">
      <p class="twist-text" id="twist-text">🎉 מדענים אמיתיים!</p>
    </div>
  </div>

  <div id="notebook">
    <div class="notebook-page">
      <div id="notebook-title">📔 מחברת המדען</div>
      <div class="sticker-grid" id="sticker-grid"></div>
      <div class="bonus-sticker" id="bonus-sticker" style="display:none">
        <img src="assets/stickers/sticker_station5_volcano_gold.png" alt="מדבקת הר געש">
        <div class="bonus-label">🌟 בונוס: הר געש!</div>
      </div>
    </div>
  </div>

  <div id="actions">
    <button class="btn-primary" onclick="window.location.href='completion.html'">קבלו תעודה 🏅</button>
    <button class="btn-secondary" onclick="window.location.href='index.html'">🏠 חזרה להאב</button>
  </div>
</div>

<script src="unlock-logic.js"></script>
<script>
(function () {
  var STATIONS = StemUnlockLogic.STATIONS;
  var mainCount = StemUnlockLogic.EXTRA_INDEX; // 4 regular stations

  var grid = document.getElementById('sticker-grid');
  for (var i = 0; i < mainCount; i++) {
    var st = STATIONS[i];
    var done = StemUnlockLogic.isStationDone(i);
    var slot = document.createElement('div');
    slot.className = 'sticker-slot' + (done ? '' : ' locked');
    slot.style.animationDelay = (0.1 + i * 0.1) + 's';
    var stickerFile = {
      0: 'sticker_station1_yeast.png',
      1: 'sticker_station2_jam.png',
      2: 'sticker_station3_cabbage.png',
      3: 'sticker_station4_icecream.png'
    }[i];
    slot.innerHTML = '<img src="assets/stickers/' + stickerFile + '" alt="' + st.name + '">' +
      (done ? '' : '<span class="lock-mark">🔒</span>');
    grid.appendChild(slot);
  }

  // 5th/gold sticker only appears if the extra (volcano) station is actually
  // done - never shown dimmed/locked, per spec ("אם הושלם ההר געש, מדבקה
  // חמישית מופיעה בזהב").
  if (StemUnlockLogic.isAllComplete()) {
    document.getElementById('bonus-sticker').style.display = 'flex';
  }

  var name = localStorage.getItem('chefName');
  if (name) {
    document.getElementById('hero-sub').textContent =
      name + ', גיליתם 4 תגליות מדעיות מהמטבח!';
  }
  document.getElementById('twist-text').textContent =
    StemUnlockLogic.isAllComplete() ? '🎉 5 תגליות - כולל הבונוס!' : '🎉 מדענים אמיתיים!';

  // Sparkles
  var c = document.getElementById('sparkles');
  var cols = ['#F7C948', '#FFD54F', '#F5921E', '#4CAF50', '#FFCA28'];
  for (var k = 0; k < 24; k++) {
    var s2 = document.createElement('div');
    s2.className = 'sp';
    var size = (Math.random() * 6 + 4) + 'px';
    s2.style.cssText = [
      'width:' + size, 'height:' + size,
      'top:' + Math.random() * 100 + '%',
      'left:' + Math.random() * 100 + '%',
      'background:' + cols[Math.floor(Math.random() * cols.length)],
      'animation-duration:' + (3 + Math.random() * 4) + 's',
      'animation-delay:' + (Math.random() * 5) + 's'
    ].join(';');
    c.appendChild(s2);
  }
})();
</script>
</body>
</html>
