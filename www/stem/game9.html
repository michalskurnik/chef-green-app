<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<script src="../assets/rc-config.js"></script>
<script src="../assets/stem-config.js"></script>
<script src="access-guard.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Assistant:wght@700;800&display=swap" rel="stylesheet">
<title>מעבדת ההתפרצות</title>
<style>
:root{ --c1:#D9531E; --c2:#F07C4C; }
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
*{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html{touch-action:pan-y;overscroll-behavior-y:none}
body{background:#F5F0DC;display:flex;justify-content:center;padding:16px 10px 36px;font-family:'Assistant',sans-serif;direction:rtl;min-height:100vh;overflow-x:hidden}
button{touch-action:manipulation;-webkit-appearance:none;font-family:inherit}

#app{width:100%;max-width:420px;background:#fff;border-radius:26px;box-shadow:0 12px 40px rgba(0,0,0,.13);overflow:hidden;animation:fadeUp .4s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

#hdr{padding:18px 18px 20px;color:#fff;text-align:center;background:linear-gradient(135deg,var(--c1),var(--c2))}
#badge{display:inline-block;background:rgba(255,255,255,.22);border-radius:20px;padding:4px 16px;font-size:13px;font-weight:700;margin-bottom:7px}
#htitle{font-family:'Fredoka One',cursive;font-size:23px}

#lab-root{padding:20px 20px 28px;min-height:52vh;display:flex;flex-direction:column;justify-content:center}

.lab-intro{font-size:16px;font-weight:700;color:#444;text-align:center;margin-bottom:18px;line-height:1.6}
.lab-note{font-size:14px;font-weight:700;color:#7a5c1e;text-align:center;min-height:20px;margin-bottom:8px}
.run-info{font-size:13px;font-weight:700;color:#999;text-align:center;margin-bottom:10px}

.cup-row{display:flex;gap:14px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}
.cup-card{position:relative;width:128px;display:flex;flex-direction:column;align-items:center;gap:7px;border-radius:16px;padding:12px 8px;transition:box-shadow .2s,transform .15s}
.cup-card.selectable{cursor:pointer;border:2px dashed #ddd}
.cup-card.selectable:active{transform:scale(.96)}
.cup-card.picked{border-color:var(--c1);box-shadow:0 4px 16px rgba(0,0,0,.14);background:rgba(0,0,0,.02)}

.cup-visual{position:relative;width:84px;height:116px;border:4px solid #999;border-bottom:none;border-radius:3px 3px 14px 14px;overflow:hidden;background:rgba(255,255,255,.5)}
.cup-vessel-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.35;pointer-events:none}
.cup-liquid{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(180deg,var(--c2),var(--c1));transition:height 1s ease;height:0%}
.cup-ruler{position:absolute;inset:0;display:flex;flex-direction:column-reverse;justify-content:space-between;pointer-events:none}
.cup-ruler .tick{border-top:1px dashed rgba(0,0,0,.18);height:25%}
.cup-bubbles{position:absolute;inset:0;opacity:0;pointer-events:none}
.cup-visual.bubbling .cup-bubbles{opacity:1;background:radial-gradient(circle 4px at 30% 80%,rgba(255,255,255,.9) 90%,transparent),radial-gradient(circle 3px at 60% 60%,rgba(255,255,255,.8) 90%,transparent),radial-gradient(circle 5px at 45% 40%,rgba(255,255,255,.7) 90%,transparent);animation:bubbleUp 1.1s ease-in-out infinite}
@keyframes bubbleUp{0%{background-position:0 100%,0 100%,0 100%;opacity:.3}100%{background-position:0 -20%,0 -30%,0 -40%;opacity:1}}

.var-icons{display:flex;gap:6px;align-items:center;justify-content:center;min-height:36px}
.var-icon{width:34px;height:34px;object-fit:contain;filter:drop-shadow(0 1px 1px rgba(0,0,0,.15))}
.var-icon.dim{opacity:.3;filter:grayscale(1)}
.var-icon.temp-cold{filter:hue-rotate(150deg) saturate(2.2)}
.var-icon.temp-hot{filter:hue-rotate(-25deg) saturate(1.8)}
.var-icon.temp-warm{filter:none}
.pick-check{position:absolute;top:6px;left:6px;width:22px;height:22px;border-radius:50%;background:#4CAF50;color:#fff;font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}

.cup-label{font-family:'Fredoka One',cursive;font-size:14px;color:#333}
.cup-tag{font-size:11px;font-weight:700;color:#888;text-align:center;line-height:1.3;min-height:28px}
.cup-readout{font-size:14px;font-weight:800;color:var(--c1);opacity:0;transition:opacity .3s}
.cup-readout.show{opacity:1}

.lab-match{font-size:15px;font-weight:700;color:#2E7D32;text-align:center;margin:8px 0 18px;line-height:1.6}

.conclusion-msg{min-height:20px}
.conclusion-row{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.conclusion-card{display:flex;align-items:center;gap:12px;background:#f7f7f7;border:2px solid #eee;border-radius:18px;padding:16px 18px;cursor:pointer;transition:all .2s}
.conclusion-card:active{transform:scale(.98)}
.conclusion-card.picked{border-color:var(--c1);background:rgba(0,0,0,.02)}
.conclusion-card.correct-pick{border-color:#F7C948;background:rgba(247,201,72,.15)}
.conclusion-card.wrong{animation:cardShake .4s ease;border-color:#EF5350}
@keyframes cardShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.cc-icon{font-size:26px}
.cc-label{font-size:15px;font-weight:700;color:#333}

.lab-btn{display:block;width:100%;border:none;border-radius:20px;padding:17px;font-size:18px;font-family:'Fredoka One',cursive;cursor:pointer;margin-top:12px;transition:opacity .2s,transform .1s}
.lab-btn:active{transform:scale(.97)}
.lab-btn.primary{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;box-shadow:0 5px 18px rgba(0,0,0,.18)}
.lab-btn.primary:disabled{opacity:.4;pointer-events:none}
.lab-btn.ghost{background:none;color:#999;box-shadow:none;font-family:'Assistant',sans-serif;font-weight:800;font-size:13px;text-decoration:underline}

.lab-done{display:flex;flex-direction:column;align-items:center;padding:16px 4px}
.lab-done-emoji{font-size:44px;margin-bottom:8px}
.lab-done-title{font-family:'Fredoka One',cursive;font-size:17px;color:#333;text-align:center;margin-bottom:6px}

#level-badge{position:absolute;top:12px;left:14px;background:rgba(255,255,255,.25);border-radius:12px;padding:3px 10px;font-size:11px;font-weight:800;color:#fff}
#hdr{position:relative}

@media(min-width:420px){
  #app{max-width:440px}
}
</style>
</head>
<body>
<div id="app">
  <header id="hdr">
    <span id="level-badge"></span>
    <div id="badge">🌋 מעבדת ההתפרצות</div>
    <h2 id="htitle">🌋 מעבדת ההתפרצות</h2>
  </header>
  <div id="lab-root"></div>
</div>

<script src="unlock-logic.js"></script>
<script src="../assets/stem-notebook-config.js"></script>

</script>
<script src="dial-lab.js"></script>
</body>
</html>
