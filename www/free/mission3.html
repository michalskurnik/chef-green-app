<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>השף הירוק — משימה 3</title>
<link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
<style>
:root {
  --green:#2d8a4e; --green-light:#57c97a; --green-dark:#1a5e35;
  --orange:#ff6b35; --yellow:#f7c948; --cream:#fffdf7; --bg:#f5f0e8;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  font-family:'Varela Round',Arial,sans-serif;
  direction:rtl; background:var(--bg);
  min-height:100vh; display:flex; flex-direction:column; overflow-x:hidden;
}

/* HEADER */
.header {
  background:linear-gradient(135deg,var(--green-dark),var(--green));
  padding:11px 20px; display:flex; align-items:center; justify-content:space-between;
  box-shadow:0 3px 12px rgba(0,0,0,0.2); flex-shrink:0;
}
.header-brand { display:flex; align-items:center; gap:8px; color:white; }
.header-icon {
  width:34px; height:34px; background:rgba(255,255,255,0.15);
  border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px;
}
.header-text { font-size:14px; font-weight:700; line-height:1.2; }
.header-text span { font-size:11px; opacity:0.75; display:block; }
.mission-tag {
  background:rgba(255,107,53,0.25); border:1px solid rgba(255,107,53,0.6);
  color:#ffb347; font-size:12px; font-weight:700; padding:4px 12px; border-radius:20px;
}

/* MAIN */
.main {
  flex:1; padding:14px 14px 20px;
  max-width:560px; width:100%; margin:0 auto;
  display:flex; flex-direction:column; gap:12px;
}

/* BITO BAR */
.bito-bar {
  background:#071a0e; border-radius:18px; padding:11px 14px;
  display:flex; align-items:center; gap:11px;
  border:2px solid rgba(0,255,136,0.2);
  box-shadow:0 0 18px rgba(0,255,136,0.07);
  position:relative; overflow:hidden; min-height:66px;
}
.bito-bar::before {
  content:''; position:absolute; inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,255,136,0.012) 3px,rgba(0,255,136,0.012) 6px);
  pointer-events:none;
}
.bito-avatar {
  width:46px; height:46px; border-radius:50%;
  border:2px solid rgba(0,255,136,0.4); background:#071a0e;
  overflow:hidden; flex-shrink:0; box-shadow:0 0 10px rgba(0,255,136,0.2);
}
.bito-avatar img { width:100%; height:100%; object-fit:cover; }
.bito-speech { flex:1; font-size:13px; font-weight:700; color:white; line-height:1.45; }
.cursor {
  display:inline-block; width:2px; height:1em; background:#00ff88;
  animation:cur 0.7s step-end infinite; vertical-align:text-bottom; margin-right:1px;
}
@keyframes cur { 0%,100%{opacity:1} 50%{opacity:0} }
.bito-dot {
  width:7px; height:7px; border-radius:50%;
  background:#00ff88; box-shadow:0 0 5px #00ff88;
  animation:bd 1s ease-in-out infinite; flex-shrink:0;
}
@keyframes bd { 0%,100%{opacity:1} 50%{opacity:0.2} }

/* PROGRESS */
.progress-wrap {  }
.progress-row { display:flex; align-items:center; gap:5px; margin-bottom:5px; }
.prog-step {
  flex:1; height:7px; border-radius:4px;
  background:rgba(45,138,78,0.12); border:1px solid rgba(45,138,78,0.15);
  transition:all 0.4s; position:relative; overflow:hidden;
}
.prog-step.done { background:var(--green); border-color:var(--green); }
.prog-step.done::after {
  content:''; position:absolute; inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.35),transparent);
  animation:shimmer 0.8s forwards;
}
@keyframes shimmer { from{transform:translateX(-100%)} to{transform:translateX(100%)} }
.prog-step.active { background:var(--yellow); border-color:var(--yellow); box-shadow:0 0 7px rgba(247,201,72,0.5); }
.prog-label { font-size:12px; font-weight:700; color:var(--green-dark); text-align:center; }

/* INSTRUCTION */
.instruction {
  background:linear-gradient(135deg,#e8f5e9,#d4edda);
  border-radius:14px; padding:10px 16px;
  border:2px solid rgba(45,138,78,0.2);
  font-size:13px; font-weight:700; color:var(--green-dark);
  text-align:center;
}

/* SEQUENCE BAR */
.sequence-bar {
  background:white; border:2px solid rgba(45,138,78,0.15);
  border-radius:14px; padding:8px 12px;
  display:flex; align-items:center; gap:5px; flex-wrap:wrap; min-height:46px;
}
.seq-label { font-size:11px; font-weight:700; color:#bbb; flex-shrink:0; }
.seq-item {
  font-size:22px; animation:seqPop 0.4s cubic-bezier(0.34,1.5,0.64,1);
  position:relative;
}
.seq-item:not(:last-child)::after { content:'›'; font-size:14px; color:#ccc; margin:0 1px; }
@keyframes seqPop { from{transform:scale(0) rotate(-15deg);opacity:0} to{transform:scale(1) rotate(0);opacity:1} }

/* STEPS GRID */
.steps-grid {
  display:grid; grid-template-columns:repeat(2,1fr); gap:10px;
}

.step-card {
  background:white; border:3px solid #e0d5c5;
  border-radius:18px; overflow:hidden;
  cursor:pointer; transition:all 0.22s cubic-bezier(0.34,1.3,0.64,1);
  position:relative; user-select:none;
  box-shadow:0 2px 8px rgba(0,0,0,0.06);
}
.step-card:hover {
  border-color:var(--green); transform:translateY(-3px) scale(1.03);
  box-shadow:0 8px 22px rgba(45,138,78,0.2);
}
.step-card:active { transform:scale(0.96); }

/* Step image */
.step-img {
  width:100%; aspect-ratio:1/1;
  object-fit:cover; display:block;
  transition:all 0.3s;
}

/* Step label bar */
.step-label {
  padding:7px 10px;
  font-size:12px; font-weight:700; color:#333; line-height:1.3;
  text-align:center; background:white;
  border-top:1px solid #f0ebe0;
}

/* Step number badge */
.step-num-badge {
  position:absolute; top:7px; right:7px;
  width:24px; height:24px; border-radius:50%;
  background:var(--green); color:white;
  font-size:12px; font-weight:900;
  display:flex; align-items:center; justify-content:center;
  opacity:0; transform:scale(0);
  transition:all 0.3s cubic-bezier(0.34,1.5,0.64,1);
  box-shadow:0 2px 6px rgba(0,0,0,0.2);
}

.step-card.correct { border-color:var(--green); animation:correctBounce 0.5s cubic-bezier(0.34,1.5,0.64,1); }
.step-card.correct .step-num-badge { opacity:1; transform:scale(1); }
.step-card.correct .step-img { filter:brightness(1.05) saturate(1.1); }
@keyframes correctBounce { 0%{transform:scale(0.92)} 60%{transform:scale(1.07)} 100%{transform:scale(1)} }

.step-card.wrong { border-color:#e53935; animation:wrongShake 0.35s; }
@keyframes wrongShake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)} }

.step-card.used {
  opacity:0.3; pointer-events:none; transform:scale(0.94);
  border-color:#ddd;
}
.step-card.used .step-img { filter:grayscale(0.5); }

/* TRANSITION OVERLAY */
#transOverlay {
  position:fixed; inset:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:rgba(26,94,53,0.93);
  z-index:200; opacity:0; pointer-events:none; transition:opacity 0.25s;
}
#transOverlay.show { opacity:1; pointer-events:auto; }
.trans-content {
  text-align:center; padding:20px;
  transform:scale(0.85); transition:transform 0.3s cubic-bezier(0.34,1.3,0.64,1);
}
#transOverlay.show .trans-content { transform:scale(1); }
.trans-img {
  width:160px; height:160px; border-radius:20px; object-fit:cover;
  box-shadow:0 8px 30px rgba(0,0,0,0.35); margin-bottom:14px;
  border:3px solid rgba(255,255,255,0.3);
}
.trans-emoji { font-size:50px; margin-bottom:6px; display:block; }
.trans-title { font-size:22px; font-weight:900; color:white; margin-bottom:5px; }
.trans-sub   { font-size:14px; color:rgba(255,255,255,0.85); }

/* WIN SCREEN */
#winScreen {
  display:none; position:fixed; inset:0;
  background:linear-gradient(160deg,#1a5e35,#2d8a4e,#57c97a);
  flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:30px; z-index:300;
}
#winScreen.show { display:flex; }
.win-bito {
  width:90px; height:90px; border-radius:50%;
  border:3px solid rgba(255,255,255,0.5); background:#071a0e;
  overflow:hidden; margin-bottom:10px;
  box-shadow:0 0 28px rgba(0,255,136,0.3);
}
.win-bito img { width:100%; height:100%; object-fit:cover; }
.win-final-img {
  width:160px; height:160px; border-radius:20px; object-fit:cover;
  box-shadow:0 8px 30px rgba(0,0,0,0.3); margin-bottom:14px;
  border:4px solid rgba(255,255,255,0.4);
  animation:winImgPop 0.6s cubic-bezier(0.34,1.4,0.64,1);
}
@keyframes winImgPop { from{transform:scale(0) rotate(-10deg)} to{transform:scale(1) rotate(0)} }
.win-stars { font-size:36px; margin-bottom:8px; }
.win-title { font-size:30px; font-weight:900; color:white; text-shadow:0 3px 10px rgba(0,0,0,0.3); margin-bottom:8px; }
.win-text  { font-size:14px; color:rgba(255,255,255,0.9); line-height:1.65; margin-bottom:22px; max-width:300px; }
.confetti-row { font-size:26px; margin-bottom:10px; animation:bounce 1.5s infinite; }
@keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
.btn-recipe {
  background:var(--yellow); color:#1a1a1a;
  font-family:inherit; font-size:19px; font-weight:900;
  padding:14px 38px; border:none; border-radius:50px; cursor:pointer;
  box-shadow:0 5px 18px rgba(247,201,72,0.5); transition:all 0.2s;
}
.btn-recipe:hover { transform:scale(1.05); }

@media(max-width:400px) {
  .step-label { font-size:11px; padding:5px 8px; }
}
</style>
</head>

const STEPS = [
  { emoji:'🔪', text:'פורסים את הבאגט לפרוסות',          order:1, trans:{ emoji:'🍞', title:'פרוסות מוכנות!',    sub:'עכשיו לשמן ולתנור...' } },
  { emoji:'🫙', text:'מברישים שמן זית ואופים ב-200°',    order:2, trans:{ emoji:'🔥', title:'הריח מדהים!',       sub:'הבאגט מזהיב יפה...' } },
  { emoji:'🌱', text:'מורחים פסטו ירוק על הפרוסה',       order:3, trans:{ emoji:'🌿', title:'ירוק ומבריק!',      sub:'שכבת פסטו מושלמת' } },
  { emoji:'🧀', text:'מניחים פרוסת מוצרלה',               order:4, trans:{ emoji:'🧀', title:'לבן ורך!',          sub:'מוצרלה איטלקית אמיתית' } },
  { emoji:'🌿', text:'שמים עלה בזיליקום טרי',            order:5, trans:{ emoji:'💚', title:'ריחני ומרענן!',     sub:'הבזיליקום מוסיף ניחוח' } },
  { emoji:'🍅', text:'מניחים חצי עגבנייה שרי',           order:6, trans:{ emoji:'🐞', title:'גוף החיפושית!',    sub:'האדום מושלם...' } },
  { emoji:'🍯', text:'מציירים כתמים עם חומץ בלסמי',     order:7, trans:{ emoji:'🎨', title:'יצירת מופת! 🐞',   sub:'החיפושית הושלמה!' } },
];

const BITO_MSGS = [
  'לחצו על השלב הראשון להכנת הברוסקטה! 🍞',
  'מעולה! עכשיו מה עושים עם הבאגט? 🔥',
  'כל הכבוד! מה מורחים על הפרוסה הקלויה? 🌿',
  'נהדר! ועכשיו הגבינה הלבנה... 🧀',
  'יפהפה! מה שמים על המוצרלה? 💚',
  'ריחני! ועכשיו לגוף החיפושית! 🍅',
  'כמעט סיימנו! רק עוד נגיעה אחת... 🍯',
];
const BITO_WRONG = [
  'לא בדיוק... נסו שלב אחר! 🤔',
  'ביטו אומר: לא נכון! 💻',
  'הסדר קצת שונה... נסו שוב 🙈',
];

let currentOrder = 1;
let shuffled = [...STEPS].sort(() => Math.random() - 0.5);
let typeTimer = null;

function init() {
  buildProgress();
  buildGrid();
  typeMessage(BITO_MSGS[0]);
  // Set win final image to step 7
  document.getElementById('winFinalImg').src = 'data:image/jpeg;base64,' + STEP_IMGS[7];
}

function buildProgress() {
  const row = document.getElementById('progressRow');
  row.innerHTML = '';
  STEPS.forEach((s,i) => {
    const d = document.createElement('div');
    d.className = 'prog-step' + (i < currentOrder-1 ? ' done' : i === currentOrder-1 ? ' active' : '');
    d.id = 'prog' + i;
    row.appendChild(d);
  });
}

function buildGrid() {
  const grid = document.getElementById('stepsGrid');
  grid.innerHTML = '';
  shuffled.forEach(step => {
    const card = document.createElement('div');
    card.className = 'step-card' + (step.order < currentOrder ? ' used' : '');
    card.id = 'card-' + step.order;
    card.innerHTML = `
      <div class="step-num-badge">${step.order}</div>
      <img class="step-img" src="data:image/jpeg;base64,${STEP_IMGS[step.order]}" alt="${step.text}" loading="lazy">
      <div class="step-label">${step.text}</div>
    `;
    card.onclick = () => pickStep(step, card);
    grid.appendChild(card);
  });
}

function pickStep(step, card) {
  if (step.order === currentOrder) {
    card.classList.add('correct');
    setTimeout(() => card.classList.add('used'), 450);

    // Sequence
    const seq = document.getElementById('seqItems');
    const span = document.createElement('span');
    span.className = 'seq-item';
    span.textContent = step.emoji;
    seq.appendChild(span);

    // Progress
    document.getElementById('prog' + (currentOrder-1))?.classList.replace('active','done');
    currentOrder++;
    if (currentOrder <= STEPS.length) {
      document.getElementById('prog' + (currentOrder-1))?.classList.add('active');
      document.getElementById('progLabel').textContent = `שלב ${currentOrder} מתוך ${STEPS.length}`;
    }

    showTransition(step, () => {
      if (currentOrder > STEPS.length) {
        showWin();
      } else {
        typeMessage(BITO_MSGS[currentOrder-1]);
        document.getElementById('instruction').textContent = `👆 לחצו על שלב ${currentOrder} — מה עושים עכשיו?`;
      }
    });

  } else {
    card.classList.add('wrong');
    setTimeout(() => card.classList.remove('wrong'), 380);
    const msg = BITO_WRONG[Math.floor(Math.random()*BITO_WRONG.length)];
    typeMessage(msg, () => {
      if (currentOrder <= STEPS.length) typeMessage(BITO_MSGS[currentOrder-1]);
    });
  }
}

function showTransition(step, cb) {
  const ov = document.getElementById('transOverlay');
  document.getElementById('transImg').src   = 'data:image/jpeg;base64,' + STEP_IMGS[step.order];
  document.getElementById('transEmoji').textContent = step.trans.emoji;
  document.getElementById('transTitle').textContent = step.trans.title;
  document.getElementById('transSub').textContent   = step.trans.sub;
  ov.classList.add('show');
  setTimeout(() => {
    ov.classList.remove('show');
    setTimeout(cb, 280);
  }, 1200);
}

function typeMessage(msg, cb) {
  const el = document.getElementById('bitoSpeech');
  if (typeTimer) clearInterval(typeTimer);
  el.innerHTML = '<span class="cursor"></span>';
  let i = 0;
  typeTimer = setInterval(() => {
    if (i >= msg.length) {
      clearInterval(typeTimer);
      el.innerHTML = msg + '<span class="cursor"></span>';
      if (cb) setTimeout(cb, 700);
      return;
    }
    el.innerHTML = msg.slice(0,++i) + '<span class="cursor"></span>';
  }, 32);
}

function showWin() {
  document.getElementById('winScreen').classList.add('show');
}

function goRecipe() { window.location.href = 'email_gate.html'; }

init();
</script>
