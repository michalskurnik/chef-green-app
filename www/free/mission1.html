<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ביטו משדר — משימה 1</title>
<link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
<style>
:root {
  --green: #2d8a4e;
  --green-light: #57c97a;
  --green-dark: #1a5e35;
  --orange: #ff6b35;
  --yellow: #f7c948;
  --bg: #0d1f14;
  --screen-green: #00ff88;
  --screen-dim: #00aa55;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Varela Round', Arial, sans-serif;
  background: var(--bg);
  direction: rtl;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* BG */
.bg {
  position: fixed; inset: 0;
  background: radial-gradient(ellipse at 30% 20%, #0a2e1a 0%, #030d07 70%);
  z-index: 0;
}

/* HEADER */
.header {
  position: relative; z-index: 10;
  width: 100%;
  background: linear-gradient(135deg, #0a2e1a, #0f3d22);
  border-bottom: 2px solid rgba(0,255,136,0.2);
  padding: 12px 24px;
  display: flex; align-items: center; justify-content: space-between;
}
.header-brand { display:flex; align-items:center; gap:10px; color:var(--screen-green); }
.header-icon {
  width:36px; height:36px;
  background:rgba(0,255,136,0.1);
  border:1px solid rgba(0,255,136,0.3);
  border-radius:50%;
  display:flex; align-items:center; justify-content:center; font-size:18px;
}
.header-text { font-size:15px; font-weight:700; }
.header-text span { font-size:11px; opacity:0.6; display:block; }
.mission-tag {
  background:rgba(255,107,53,0.2); border:1px solid rgba(255,107,53,0.5);
  color:var(--orange); font-size:12px; font-weight:700;
  padding:4px 12px; border-radius:20px;
}

/* MAIN */
.main {
  position:relative; z-index:5;
  width:100%; max-width:520px;
  padding:16px 20px;
  display:flex; flex-direction:column; align-items:center; gap:14px;
}

/* ===== BITO + WAVES ===== */
.bito-stage {
  position:relative;
  display:flex; align-items:center; justify-content:center;
  width:300px; height:200px;
}
.wave {
  position:absolute; border-radius:50%;
  border:2px solid rgba(0,255,136,0.5);
  animation:waveOut 2.4s ease-out infinite;
  pointer-events:none;
}
.wave:nth-child(1) { width:210px; height:210px; animation-delay:0s; }
.wave:nth-child(2) { width:270px; height:270px; animation-delay:0.6s; }
.wave:nth-child(3) { width:330px; height:330px; animation-delay:1.2s; }
@keyframes waveOut {
  0%   { transform:scale(0.75); opacity:0.8; }
  100% { transform:scale(1);    opacity:0; }
}
.bito-circle {
  width:160px; height:160px; border-radius:50%;
  border:3px solid rgba(0,255,136,0.5);
  background:#071a0e;
  box-shadow: 0 0 0 4px rgba(0,255,136,0.15), 0 0 35px rgba(0,255,136,0.25);
  cursor:pointer; position:relative; z-index:10; overflow:hidden;
  transition:all 0.2s;
  display:flex; align-items:center; justify-content:center;
}
.bito-circle:hover {
  border-color:rgba(0,255,136,0.9);
  box-shadow:0 0 0 6px rgba(0,255,136,0.2), 0 0 45px rgba(0,255,136,0.4);
  transform:scale(1.04);
}
.bito-circle:active { transform:scale(0.97); }
.bito-circle.disabled { cursor:default; opacity:0.6; transform:none !important; }
.bito-img { width:154px; height:154px; object-fit:cover; object-position:center; border-radius:50%; }
.bito-pulse {
  position:absolute; inset:-8px; border-radius:50%;
  border:2px solid rgba(0,255,136,0.25);
  animation:idlePulse 2s ease-in-out infinite;
}
@keyframes idlePulse {
  0%,100% { transform:scale(1); opacity:0.4; }
  50%      { transform:scale(1.06); opacity:0.8; }
}

/* TAP LABEL */
.tap-label {
  font-size:13px; color:rgba(0,255,136,0.75);
  text-align:center; min-height:20px;
  animation:blink 1.8s ease-in-out infinite;
}
@keyframes blink { 0%,100%{opacity:0.5} 50%{opacity:1} }

/* ===== CLUE DISPLAY ===== */
.clue-display {
  width:100%;
  background:#050f09;
  border:2px solid rgba(0,255,136,0.2);
  border-radius:16px;
  padding:14px 18px;
  min-height:80px;
  position:relative; overflow:hidden;
  box-shadow: inset 0 0 25px rgba(0,0,0,0.5);
}
.clue-display::before {
  content:'';
  position:absolute; inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,255,136,0.015) 2px,rgba(0,255,136,0.015) 4px);
  pointer-events:none; border-radius:14px;
}
.screen-bar {
  display:flex; align-items:center; gap:8px; margin-bottom:10px;
  padding-bottom:8px; border-bottom:1px solid rgba(0,255,136,0.12);
}
.screen-dot {
  width:7px; height:7px; border-radius:50%;
  background:var(--screen-green);
  box-shadow:0 0 5px var(--screen-green);
  animation:screenBlink 1s ease-in-out infinite;
}
@keyframes screenBlink { 0%,100%{opacity:1} 50%{opacity:0.3} }
.screen-label { font-size:10px; color:var(--screen-dim); font-family:monospace; letter-spacing:2px; }

.clue-idle {
  display:flex; flex-direction:column; align-items:center; gap:6px; padding:8px 0;
  color:rgba(0,255,136,0.35); font-size:13px; font-family:monospace; text-align:center;
}
.cursor {
  display:inline-block; width:2px; height:1em;
  background:var(--screen-green); margin-right:2px;
  animation:cur 0.7s step-end infinite; vertical-align:text-bottom;
}
@keyframes cur { 0%,100%{opacity:1} 50%{opacity:0} }

.clue-active { display:none; }
.clue-active.show { display:flex; align-items:center; gap:14px; animation:slideIn 0.4s cubic-bezier(0.34,1.3,0.64,1); }
@keyframes slideIn { from{opacity:0;transform:translateX(12px)} to{opacity:1;transform:translateX(0)} }
.clue-big-icon { font-size:40px; filter:drop-shadow(0 0 6px rgba(0,255,136,0.3)); flex-shrink:0; }
.clue-content { flex:1; }
.clue-num-label { font-family:monospace; font-size:10px; color:var(--screen-dim); letter-spacing:2px; margin-bottom:4px; }
.clue-text { font-size:17px; font-weight:700; color:white; line-height:1.3; }

/* ===== ANSWER GRID ===== */
.answer-section {
  width:100%;
}
.answer-prompt {
  font-size:13px; color:rgba(0,255,136,0.65); text-align:center;
  font-family:monospace; letter-spacing:1px; margin-bottom:10px;
}
.answer-grid {
  display:grid; grid-template-columns:repeat(4,1fr); gap:8px;
}
.ans-btn {
  background:rgba(0,255,136,0.04);
  border:2px solid rgba(0,255,136,0.18);
  border-radius:14px; padding:10px 6px 8px;
  font-family:'Varela Round',Arial,sans-serif;
  cursor:pointer; transition:all 0.2s; text-align:center;
  display:flex; flex-direction:column; align-items:center; gap:5px;
}
.ans-btn:hover {
  background:rgba(0,255,136,0.1); border-color:rgba(0,255,136,0.5);
  transform:translateY(-3px) scale(1.04);
  box-shadow:0 4px 15px rgba(0,255,136,0.15);
}
.ans-btn:active { transform:scale(0.96); }
.ans-emoji { font-size:34px; }
.ans-name { font-size:12px; font-weight:700; color:rgba(255,255,255,0.75); }
.ans-btn.correct {
  background:rgba(0,255,136,0.18); border-color:var(--screen-green);
  box-shadow:0 0 18px rgba(0,255,136,0.3);
  animation:correctPop 0.4s cubic-bezier(0.34,1.5,0.64,1);
}
.ans-btn.correct .ans-name { color:var(--screen-green); }
@keyframes correctPop { from{transform:scale(0.9)} to{transform:scale(1)} }
.ans-btn.wrong {
  background:rgba(229,57,53,0.12); border-color:rgba(229,57,53,0.4);
  animation:shake 0.3s;
}
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
.ans-btn.disabled { pointer-events:none; opacity:0.4; }

/* ===== COLLECTED INGREDIENTS ===== */
.collected-wrap {
  width:100%;
  background:rgba(0,255,136,0.04);
  border:1px solid rgba(0,255,136,0.15);
  border-radius:14px;
  padding:10px 14px;
}
.collected-title {
  font-size:11px; color:var(--screen-dim); font-family:monospace;
  letter-spacing:2px; margin-bottom:8px;
}
.collected-items {
  display:flex; gap:8px; flex-wrap:wrap; min-height:40px; align-items:center;
}
.collected-item {
  background:rgba(0,255,136,0.12);
  border:1px solid rgba(0,255,136,0.35);
  border-radius:10px; padding:5px 10px;
  font-size:13px; font-weight:700; color:white;
  display:flex; align-items:center; gap:5px;
  animation:popIn 0.4s cubic-bezier(0.34,1.5,0.64,1);
}
@keyframes popIn { from{transform:scale(0);opacity:0} to{transform:scale(1);opacity:1} }
.collected-empty {
  font-size:12px; color:rgba(0,255,136,0.25); font-family:monospace;
}

/* PROGRESS DOTS */
.progress-dots {
  display:flex; gap:8px;
}
.pdot {
  width:32px; height:7px; border-radius:4px;
  background:rgba(0,255,136,0.12);
  border:1px solid rgba(0,255,136,0.2);
  transition:all 0.4s;
}
.pdot.lit {
  background:var(--screen-green);
  box-shadow:0 0 8px rgba(0,255,136,0.6);
  border-color:var(--screen-green);
}

/* FLASH */
.flash {
  position:fixed; inset:0;
  background:radial-gradient(circle,rgba(0,255,136,0.12) 0%,transparent 70%);
  pointer-events:none; opacity:0; z-index:100; transition:opacity 0.1s;
}
.flash.on { opacity:1; }

/* MOBILE */
@media(max-width:480px){
  .answer-grid { grid-template-columns:repeat(4,1fr); gap:6px; }
  .ans-emoji { font-size:26px; }
  .ans-name { font-size:10px; }
  .bito-circle { width:130px; height:130px; }
  .bito-img { width:124px; height:124px; }
  .wave:nth-child(1) { width:160px; height:160px; }
  .wave:nth-child(2) { width:220px; height:220px; }
  .wave:nth-child(3) { width:280px; height:280px; }
}
</style>
</head>
<body>
<div class="bg"></div>
<div class="flash" id="flash"></div>

<div class="header">
  <div class="header-brand">
    <div class="header-icon">🤖</div>
    <div class="header-text">ביטו משדר <span>תחנת הרמזים לפיענוח מרכיבי המתכון</span></div>
  </div>
  <div class="mission-tag">🔍 משימה 1/3</div>
  <button onclick="window.location.href='mission3.html'" style="background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:white;font-family:inherit;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;cursor:pointer;">דלג ←</button>
</div>

<div class="main">

  <!-- BITO -->
  <div class="bito-stage">
    <div class="wave"></div>
    <div class="wave"></div>
    <div class="wave"></div>
    <div class="bito-circle" id="bitoBtn" onclick="transmit()">
      <img src="/assets/images/shared-bg.png" class="bito-img" alt="ביטו">
      <div class="bito-pulse"></div>
    </div>
  </div>

  <div class="tap-label" id="tapLabel">📡 לחץ על ביטו לרמז הראשון</div>

  <!-- PROGRESS -->
  <div class="progress-dots">
    <div class="pdot" id="pd0"></div>
    <div class="pdot" id="pd1"></div>
    <div class="pdot" id="pd2"></div>
    <div class="pdot" id="pd3"></div>
  </div>

  <!-- CLUE SCREEN -->
  <div class="clue-display">
    <div class="screen-bar">
      <div class="screen-dot"></div>
      <div class="screen-label">BITO_TRANSMIT // פענוח רמז</div>
    </div>
    <div class="clue-idle" id="clueIdle">
      <span style="font-size:24px">📡</span>
      <span>ממתין לשידור... <span class="cursor"></span></span>
    </div>
    <div class="clue-active" id="clueActive">
      <span class="clue-big-icon" id="clueIcon">🍞</span>
      <div class="clue-content">
        <div class="clue-num-label" id="clueNumLabel">// רמז_01</div>
        <div class="clue-text" id="clueText">טקסט רמז</div>
      </div>
    </div>
  </div>

  <!-- ANSWER GRID -->
  <div class="answer-section" id="answerSection" style="visibility:hidden;">
    <div class="answer-prompt">// איזה מרכיב מתאים לרמז?</div>
    <div class="answer-grid" id="answerGrid"></div>
  </div>

  <!-- COLLECTED -->
  <div class="collected-wrap">
    <div class="collected-title">// מרכיבים שזוהו</div>
    <div class="collected-items" id="collectedItems">
      <span class="collected-empty">עדיין לא זוהו מרכיבים...</span>
    </div>
  </div>

</div>

<script>
const clues = [
  {
    icon: '🍞',
    text: 'אני מתחיל בפרוסה פריכה שנאפית בתנור עד שמזהיבה',
    correct: { emoji:'🥖', name:'באגט' },
    wrong: [
      { emoji:'🍝', name:'פסטה' },
      { emoji:'🥚', name:'ביצה' },
      { emoji:'🧅', name:'בצל' },
    ]
  },
  {
    icon: '🍅',
    text: 'משהו אדום, קטן ועגול — מתוק וטרי!',
    correct: { emoji:'🍅', name:'עגבנייה שרי' },
    wrong: [
      { emoji:'🍓', name:'תות' },
      { emoji:'🫑', name:'פלפל' },
      { emoji:'🍇', name:'ענבים' },
    ]
  },
  {
    icon: '⚪',
    text: 'גבינה לבנה ורכה שמגיעה מאיטליה',
    correct: { emoji:'⚪', name:'מוצרלה' },
    wrong: [
      { emoji:'🥛', name:'חלב' },
      { emoji:'🧈', name:'חמאה' },
      { emoji:'🫙', name:'שמנת' },
    ]
  },
  {
    icon: '🌿',
    text: 'עלה ירוק ריחני שגדל במטבח של כל שף איטלקי',
    correct: { emoji:'🌿', name:'בזיליקום' },
    wrong: [
      { emoji:'🥬', name:'חסה' },
      { emoji:'🌾', name:'טימין' },
      { emoji:'🥦', name:'ברוקולי' },
    ]
  },
];

let current = -1;
let waitingAnswer = false;
let collected = [];

function transmit() {
  if (waitingAnswer) return;
  if (current >= clues.length - 1) return;

  // flash
  const fl = document.getElementById('flash');
  fl.classList.add('on');
  setTimeout(() => fl.classList.remove('on'), 180);

  // burst waves
  document.querySelectorAll('.wave').forEach(w => {
    w.style.animationDuration = '0.5s';
    setTimeout(() => w.style.animationDuration = '2.4s', 600);
  });

  current++;
  const clue = clues[current];

  // show clue screen
  document.getElementById('clueIdle').style.display = 'none';
  const active = document.getElementById('clueActive');
  active.classList.remove('show');
  document.getElementById('clueIcon').textContent = clue.icon;
  document.getElementById('clueNumLabel').textContent = `// רמז_0${current+1}`;
  document.getElementById('clueText').textContent = clue.text;
  requestAnimationFrame(() => active.classList.add('show'));

  // light dot
  document.getElementById('pd' + current).classList.add('lit');

  // build answer options (shuffle)
  const options = [clue.correct, ...clue.wrong].sort(() => Math.random() - 0.5);
  const grid = document.getElementById('answerGrid');
  grid.innerHTML = '';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'ans-btn';
    btn.innerHTML = `<span class="ans-emoji">${opt.emoji}</span><span class="ans-name">${opt.name}</span>`;
    btn.onclick = () => pick(btn, opt, clue.correct);
    grid.appendChild(btn);
  });

  document.getElementById('answerSection').style.visibility = 'visible';
  waitingAnswer = true;

  // update label
  document.getElementById('tapLabel').textContent = `❓ מה המרכיב שביטו תיאר?`;
  document.getElementById('bitoBtn').classList.add('disabled');
}

function pick(btn, chosen, correct) {
  if (chosen.name === correct.name) {
    btn.classList.add('correct');
    // disable all
    document.querySelectorAll('.ans-btn').forEach(b => b.classList.add('disabled'));

    // add to collected
    collected.push(correct);
    renderCollected();

    waitingAnswer = false;
    setTimeout(() => {
      document.getElementById('answerSection').style.visibility = 'hidden';
      document.getElementById('bitoBtn').classList.remove('disabled');

      if (current < clues.length - 1) {
        const left = clues.length - 1 - current;
        document.getElementById('tapLabel').textContent = `📡 עוד ${left} רמז${left>1?'ים':''} — לחץ על ביטו!`;
      } else {
        document.getElementById('tapLabel').textContent = '🎉 כל המרכיבים זוהו!';
        document.getElementById('bitoBtn').classList.add('disabled');
        setTimeout(showSuccess, 700);
      }
    }, 800);

  } else {
    btn.classList.add('wrong');
    setTimeout(() => btn.classList.remove('wrong'), 500);
  }
}

function renderCollected() {
  const container = document.getElementById('collectedItems');
  container.innerHTML = '';
  if (collected.length === 0) {
    container.innerHTML = '<span class="collected-empty">עדיין לא זוהו מרכיבים...</span>';
    return;
  }
  collected.forEach(item => {
    const div = document.createElement('div');
    div.className = 'collected-item';
    div.innerHTML = `${item.emoji} ${item.name}`;
    container.appendChild(div);
  });
}

function showSuccess() {
  window.location.href = 'mission3.html';
}
</script>
</body>
</html>
