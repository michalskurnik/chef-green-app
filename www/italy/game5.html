<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Assistant:wght@700;800&display=swap" rel="stylesheet">
<title>מאפה פסטה וגבינות – מה נכנס לסל?</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
body{background:#FFF8E7;display:flex;justify-content:center;font-family:'Assistant',sans-serif;direction:rtl;min-height:100vh;overflow:hidden}
#app{width:100%;max-width:360px;background:#fff;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.12)}

/* Header */
#hdr{padding:10px 16px 8px;color:#fff;text-align:center;background:linear-gradient(135deg,#D4872A,#F0A850);flex-shrink:0}
#badge{display:inline-block;background:rgba(255,255,255,.22);border-radius:20px;padding:2px 13px;font-size:12px;font-weight:700;margin-bottom:4px}
#htitle{font-family:'Fredoka One',cursive;font-size:19px;margin-bottom:2px}
#hsub{font-size:11px;opacity:.9;font-weight:700}

/* Progress row */
#top-row{display:flex;align-items:center;justify-content:space-between;padding:6px 14px 2px;flex-shrink:0}
#prog-txt{font-size:12px;font-weight:800;color:#888}
#skip-btn{background:none;border:2px solid #DDD;border-radius:14px;padding:5px 12px;font-size:12px;font-weight:800;color:#AAA;cursor:pointer;font-family:'Assistant',sans-serif;touch-action:manipulation}
#prog-wrap{padding:2px 14px 6px;flex-shrink:0}
#prog-bg{height:7px;background:#EEE;border-radius:4px;overflow:hidden}
#prog-bar{height:100%;width:0%;background:linear-gradient(90deg,#D4872A,#F0A850);border-radius:4px;transition:width .4s ease}

/* Items grid — flex sibling below zones-wrap */
#items-area{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:8px 10px;flex-shrink:0;background:#FFF8E7;align-content:center;min-height:110px}
.ing-card{display:flex;flex-direction:column;align-items:center;gap:2px;background:#FFF8EE;border:2px solid #EDD8B0;border-radius:12px;padding:5px 3px 4px;cursor:grab;transition:opacity .2s,transform .15s,box-shadow .15s;touch-action:none;-webkit-user-drag:none}
.ing-card.dragging{opacity:.25}
.ing-card.sorted{display:none}
.ing-card img{width:52px;height:52px;object-fit:contain;pointer-events:none;display:block;margin:0 auto}
.ing-card .lbl{font-size:8px;font-weight:800;color:#5D4037;text-align:center;line-height:1.2;pointer-events:none;word-break:keep-all}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.ing-card.shake{animation:shake .45s ease}

/* Feedback — floating overlay */
#feedback{position:absolute;top:38%;left:50%;transform:translateX(-50%);white-space:nowrap;background:rgba(0,0,0,.62);color:#fff;padding:5px 16px;border-radius:20px;font-size:12px;font-weight:800;z-index:10;transition:opacity .3s;pointer-events:none}
#feedback.good{opacity:1}
#feedback.bad{opacity:1}
#feedback.empty{opacity:0}

/* Game area — background rendered as <img> so we can map image coordinates */
#zones-wrap{flex:1;position:relative;overflow:hidden;min-height:0}
#game-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;z-index:0}

/* Drop zones — invisible by default, only detection areas */
.drop-zone{position:absolute;display:flex;flex-direction:column;background:transparent;border:none;transition:background .15s,box-shadow .15s;overflow:hidden}

/* Hover feedback only — no colored panel */
#zone-yes.over{background:rgba(46,125,50,.22);box-shadow:inset 0 0 0 3px rgba(100,220,100,.8)}
#zone-no.over {background:rgba(183,28,28,.22);box-shadow:inset 0 0 0 3px rgba(220,80,80,.8)}

/* Zone labels hidden in production — only shown in debug mode */
.zone-hdr{display:none}

/* Zone positions set dynamically by positionZoneDivs() */
#zone-yes{border-radius:16px}
#zone-no{border-radius:16px}

/* Collected items — anchored over the bright surface panel in the background */
.surface-items-layer{position:absolute;left:34px;right:34px;bottom:155px;height:135px;display:flex;flex-wrap:wrap;align-content:flex-start;justify-content:center;gap:8px;pointer-events:none;z-index:20;overflow:hidden}
.surface-item{width:62px;height:62px;object-fit:contain;display:block}

/* Drag clone */
#drag-clone{position:fixed;z-index:9999;pointer-events:none;opacity:.88;transform:scale(1.08);border-radius:12px}

/* Win overlay */
#win-screen{display:none;position:fixed;inset:0;z-index:200;background:rgba(212,135,42,.94);flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 20px}
#win-screen.show{display:flex}
.w-icon{font-size:60px;margin-bottom:10px}
.w-title{font-family:'Fredoka One',cursive;font-size:26px;color:#fff;margin-bottom:6px}
#w-stars{font-size:34px;letter-spacing:5px;margin-bottom:12px}
.w-sub{font-size:14px;color:rgba(255,255,255,.92);font-weight:700;line-height:1.7;margin-bottom:22px}
.w-btn{background:linear-gradient(135deg,#FF6B35,#F7C948);color:#fff;border:none;border-radius:20px;padding:14px 40px;font-size:18px;font-family:'Fredoka One',cursive;cursor:pointer;box-shadow:0 5px 18px rgba(255,107,53,.5);touch-action:manipulation}

/* Confetti */
@keyframes cfFall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>
<div id="app">
  <div id="hdr">
    <div id="badge">🇮🇹 משחק 1 - מאפה פסטה וגבינות</div>
    <h2 id="htitle">🧺 מה נכנס לסל?</h2>
    <p id="hsub">גררו את המרכיבים למקום המתאים</p>
  </div>

  <div id="top-row">
    <span id="prog-txt">0 / 9</span>
    <button id="skip-btn" onclick="skipGame()">דלג ←</button>
  </div>
  <div id="prog-wrap"><div id="prog-bg"><div id="prog-bar"></div></div></div>

  <div id="zones-wrap" class="game-area">
    <img id="game-bg" src="assets/pasta_bake_bg.png" alt="">
    <div id="zone-yes" class="drop-zone" data-zone="yes">
      <div class="zone-hdr"><span class="zone-icon">🧺</span><span class="zone-lbl">נכנס לסל</span></div>
    </div>
    <div id="zone-no" class="drop-zone" data-zone="no">
      <div class="zone-hdr"><span class="zone-icon">🚫</span><span class="zone-lbl">לא למתכון הזה</span></div>
    </div>
    <div class="surface-items-layer"></div>
    <div id="feedback" class="empty"> </div>
  </div>
  <div id="items-area"></div>

  <div id="win-screen">
    <div class="w-icon">🎉</div>
    <div class="w-title">כל הכבוד!</div>
    <div id="w-stars">⭐⭐⭐</div>
    <div class="w-sub">סל הקניות מוכן!<br>מאפה פסטה וגבינות מחכה לכם 🍝</div>
    <button class="w-btn" onclick="window.location.href='game6.html'">המשך לבישול ▶</button>
  </div>
</div>

<script src="drag-zones.js"></script>
<script>
const INGREDIENTS = [
  {id:'milk',           image:'assets/game5/milk.png',           label:'חלב',          isCorrect:true},
  {id:'sweet_potato',   image:'assets/game5/sweet_potato.png',   label:'בטטה',         isCorrect:true},
  {id:'shredded_cheese',image:'assets/game5/shredded_cheese.png',label:'גבינה מגורדת',isCorrect:true},
  {id:'cottage',        image:'assets/game5/cottage.png',        label:'גבינה קוטג׳', isCorrect:true},
  {id:'carrot',         image:'assets/game5/carrot.png',         label:'גזר',          isCorrect:true},
  {id:'cooking_cream',  image:'assets/game5/cooking_cream.png',  label:'שמנת לבישול', isCorrect:true},
  {id:'sugar',          image:'assets/game5/sugar.png',          label:'סוכר',         isCorrect:true},
  {id:'chocolate',      image:'assets/game5/chocolate.png',      label:'שוקולד',       isCorrect:false},
  {id:'snacks',         image:'assets/game5/snacks.png',         label:'חטיפים',       isCorrect:false},
];

let sortedCount = 0;
let mistakes    = 0;
let dragEl      = null;
let clone       = null;
let cloneOX     = 0, cloneOY = 0;
let fbTimer     = null;

// ── Drop zone system ─────────────────────────────────────────────
// Pixel coords in the original 941×1672 background image.
// Separate hit (detection) and visual (highlight glow) rects allow
// fine-tuning without changing the visible zone position.
const dz = new DragZones({
  img: document.getElementById('game-bg'),
  zones: {
    correct: {
      hit:    { x: 255, y: 720, width: 405, height: 365 },
      visual: { x: 255, y: 720, width: 405, height: 365 },
      el: document.getElementById('zone-yes'),
    },
    wrong: {
      hit:    { x: 660, y: 850, width: 265, height: 285 },
      visual: { x: 660, y: 850, width: 265, height: 285 },
      el: document.getElementById('zone-no'),
    },
  },
  debug: window.location.search.includes('debug=true'),
});

const DEBUG = dz.debug;
if (DEBUG) {
  document.querySelectorAll('.zone-hdr').forEach(h => h.style.display = 'block');
  document.querySelector('.surface-items-layer').style.outline = '2px solid blue';
}

// ── Build shuffled items ─────────────────────────────────────────
const shuffled = [...INGREDIENTS].sort(() => Math.random() - 0.5);
const area = document.getElementById('items-area');

shuffled.forEach(ing => {
  const card = document.createElement('div');
  card.className = 'ing-card';
  card.dataset.id      = ing.id;
  card.dataset.correct = ing.isCorrect;
  card.dataset.image   = ing.image;
  card.draggable = true;
  card.innerHTML = `<img src="${ing.image}" alt="${ing.label}" onerror="console.error('Missing image:',this.src)"><span class="lbl">${ing.label}</span>`;

  // Desktop drag
  card.addEventListener('dragstart', e => {
    dragEl = card;
    e.dataTransfer.effectAllowed = 'move';
    setTimeout(() => card.classList.add('dragging'), 0);
  });
  card.addEventListener('dragend', () => card.classList.remove('dragging'));

  // Touch drag
  card.addEventListener('touchstart', onTouchStart, {passive: false});
  card.addEventListener('touchmove',  onTouchMove,  {passive: false});
  card.addEventListener('touchend',   onTouchEnd);

  area.appendChild(card);
});

// ── Drop zones (game-area level) ─────────────────────────────────
const gameAreaEl = document.querySelector('.game-area');
gameAreaEl.addEventListener('dragover', e => {
  e.preventDefault();
  dz.highlight(dz.zoneAtPoint(e.clientX, e.clientY));
});
gameAreaEl.addEventListener('dragleave', e => {
  if (!gameAreaEl.contains(e.relatedTarget)) dz.clearHighlight();
});
gameAreaEl.addEventListener('drop', e => {
  e.preventDefault();
  dz.clearHighlight();
  if (dragEl) {
    const result = dz.zoneAtPoint(e.clientX, e.clientY);
    if (result) handleDrop(dragEl, result);
    dragEl = null;
  }
});

// ── Touch handlers ───────────────────────────────────────────────
function onTouchStart(e) {
  e.preventDefault();
  const card = e.currentTarget;
  if (card.classList.contains('sorted')) return;
  dragEl = card;
  const t = e.touches[0];
  const r = card.getBoundingClientRect();
  cloneOX = t.clientX - r.left;
  cloneOY = t.clientY - r.top;

  clone = card.cloneNode(true);
  clone.id = 'drag-clone';
  clone.style.width  = r.width  + 'px';
  clone.style.height = r.height + 'px';
  clone.style.top    = r.top    + 'px';
  clone.style.left   = r.left   + 'px';
  document.body.appendChild(clone);
  card.classList.add('dragging');
}

function onTouchMove(e) {
  e.preventDefault();
  if (!clone) return;
  const t = e.touches[0];
  clone.style.top  = (t.clientY - cloneOY) + 'px';
  clone.style.left = (t.clientX - cloneOX) + 'px';
  dz.highlight(dz.zoneAtElement(clone));
  dz.logDrag(dragEl.dataset.id, clone);
}

function onTouchEnd(e) {
  if (!clone || !dragEl) return;
  const result = dz.zoneAtElement(clone);
  clone.remove(); clone = null;
  dragEl.classList.remove('dragging');
  dz.clearHighlight();
  if (result) handleDrop(dragEl, result);
  dragEl = null;
}

// ── Drop logic ───────────────────────────────────────────────────
function handleDrop(card, result) {
  const itemCorrect   = card.dataset.correct === 'true';
  const droppedYes    = result === 'correct';
  const isCorrectDrop = itemCorrect === droppedYes;

  if (isCorrectDrop) {
    card.classList.add('sorted');

    if (droppedYes) {
      const img = document.createElement('img');
      img.src       = card.dataset.image;
      img.alt       = '';
      img.className = 'surface-item';
      document.querySelector('.surface-items-layer').appendChild(img);
    }

    sortedCount++;
    updateProgress();
    showFeedback(droppedYes ? '🎉 מעולה! זה מתאים למתכון' : '✅ נכון! זה לא נכנס למתכון הזה', true);

    if (sortedCount >= INGREDIENTS.length) setTimeout(showWin, 900);
  } else {
    mistakes++;
    showFeedback('❌ כמעט! נסו שוב', false);
    card.classList.add('shake');
    setTimeout(() => card.classList.remove('shake'), 500);
  }
}

// ── UI helpers ────────────────────────────────────────────────────
function updateProgress() {
  document.getElementById('prog-bar').style.width = (sortedCount / INGREDIENTS.length * 100) + '%';
  document.getElementById('prog-txt').textContent = `${sortedCount} / ${INGREDIENTS.length}`;
}

function showFeedback(msg, good) {
  const el = document.getElementById('feedback');
  el.textContent = msg;
  el.className = good ? 'good' : 'bad';
  if (fbTimer) clearTimeout(fbTimer);
  fbTimer = setTimeout(() => { el.className = 'empty'; }, 1800);
}

function showWin() {
  const stars = mistakes === 0 ? 3 : mistakes <= 2 ? 2 : 1;
  const d = JSON.parse(localStorage.getItem('italy_stars_detail') || '[]');
  while (d.length < 3) d.push(0);
  if (stars > d[2]) d[2] = stars;
  localStorage.setItem('italy_stars_detail', JSON.stringify(d));
  localStorage.setItem('italy_stars', d.reduce((a, b) => a + b, 0));

  document.getElementById('w-stars').textContent =
    stars === 3 ? '⭐⭐⭐' : stars === 2 ? '⭐⭐☆' : '⭐☆☆';
  document.getElementById('win-screen').classList.add('show');
  spawnConfetti();
}

function skipGame() {
  const d = JSON.parse(localStorage.getItem('italy_stars_detail') || '[]');
  while (d.length < 3) d.push(0);
  if (!d[2]) d[2] = 1;
  localStorage.setItem('italy_stars_detail', JSON.stringify(d));
  localStorage.setItem('italy_stars', d.reduce((a, b) => a + b, 0));
  window.location.href = 'game6.html';
}

function spawnConfetti() {
  const colors = ['#FF6B35','#F7C948','#4CAF50','#2196F3','#E91E63','#9C27B0','#fff'];
  for (let i = 0; i < 48; i++) {
    const el = document.createElement('div');
    const size = 6 + Math.random() * 6;
    el.style.cssText = [
      'position:fixed','z-index:199',
      `width:${size}px`,`height:${size}px`,
      `background:${colors[i % colors.length]}`,
      `border-radius:${Math.random() > 0.5 ? '50%' : '2px'}`,
      `left:${Math.random() * 100}vw`,
      'top:-12px',
      `animation:cfFall ${1.4 + Math.random() * 1.4}s ${Math.random() * 0.9}s ease-in forwards`,
    ].join(';');
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3500);
  }
}
</script>
</body>
</html>
