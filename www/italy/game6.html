<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Assistant:wght@700;800&display=swap" rel="stylesheet">
<title>מאפה פסטה וגבינות – סדר שלבים</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
body{background:#FFF8E7;display:flex;justify-content:center;padding:16px 10px 36px;font-family:'Assistant',sans-serif;direction:rtl;min-height:100vh}
#app{width:100%;max-width:360px;background:#fff;border-radius:26px;box-shadow:0 12px 40px rgba(0,0,0,.13);overflow:hidden;animation:fadeUp .4s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes starPop{from{transform:scale(0) rotate(-15deg);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes correctPop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}

#hdr{padding:13px 18px 15px;color:#fff;text-align:center;background:linear-gradient(135deg,#6A1B9A,#AB47BC);transition:background .6s}
#hdr.done{background:linear-gradient(135deg,#FF6B35,#F7C948)}
#badge{display:inline-block;background:rgba(255,255,255,.22);border-radius:20px;padding:2px 13px;font-size:12px;font-weight:700;margin-bottom:6px}
#htitle{font-family:'Fredoka One',cursive;font-size:20px;margin-bottom:4px}
#hsub{font-size:12px;opacity:.9;font-weight:700;line-height:1.5}

#top-row{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 6px}
#prog-txt{font-size:12px;font-weight:800;color:#888}
#top-btns{display:flex;gap:8px}
#skip-btn{background:none;border:2px solid #DDD;border-radius:14px;padding:6px 14px;font-size:12px;font-weight:800;color:#AAA;cursor:pointer;font-family:'Assistant',sans-serif}
#check-btn{background:linear-gradient(135deg,#6A1B9A,#AB47BC);color:#fff;border:none;border-radius:14px;padding:6px 18px;font-size:13px;font-weight:800;cursor:pointer;font-family:'Assistant',sans-serif;opacity:.4;pointer-events:none;transition:all .25s}
#check-btn.ready{opacity:1;pointer-events:auto;box-shadow:0 3px 12px rgba(106,27,154,.4)}

#list{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;padding:4px 16px 8px}

.card{border:2px solid #EDD8B0;border-radius:16px;overflow:hidden;position:relative;cursor:grab;transition:box-shadow .2s,transform .2s,border-color .2s;aspect-ratio:1/1}
.card:active{cursor:grabbing}
.card.dragging{opacity:.3;transform:scale(.97)}
.card.over{border-color:#6A1B9A;transform:scale(1.02);box-shadow:0 4px 12px rgba(106,27,154,.3)}
.card.correct{border-color:#4CAF50;animation:correctPop .35s ease}
.card.wrong{border-color:#EF5350;animation:shake .4s ease}

.card-img{width:100%;height:100%;object-fit:cover;display:block}
.card-badge{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.55);color:#fff;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;pointer-events:none}

#hint-bar{text-align:center;padding:2px 16px 10px;font-size:12px;font-weight:700;color:#888;min-height:22px}


#done-panel{display:none;flex-direction:column;align-items:center;padding:10px 20px 24px}
#stars{display:flex;gap:12px;padding:4px 0 10px}
.str{font-size:40px;filter:drop-shadow(0 2px 6px gold)}
#dmsg{font-size:14px;font-weight:700;color:#636e72;text-align:center;line-height:1.65;margin-bottom:14px}
#nbtn{background:linear-gradient(135deg,#FF6B35,#FF8C42);color:#fff;border:none;border-radius:18px;padding:14px 44px;font-size:17px;font-family:'Fredoka One',cursive;cursor:pointer;box-shadow:0 5px 18px rgba(255,107,53,.42)}

#recipe-screen{display:none;position:fixed;inset:0;z-index:300;background:#1A1A2E;flex-direction:column;overflow:hidden}
#recipe-screen-hdr{background:linear-gradient(135deg,#6A1B9A,#AB47BC);color:#fff;text-align:center;padding:18px 16px 14px;flex-shrink:0}
#recipe-screen-title{font-family:'Fredoka One',cursive;font-size:22px}
#recipe-scroll{flex:1;display:flex;flex-direction:column;overflow:hidden}
#recipe-iframe{flex:1;width:100%;border:none;background:#fff}
#recipe-fallback{display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:32px 24px;text-align:center;color:rgba(255,255,255,.75);font-size:15px;font-weight:700}
#dl-btn{background:linear-gradient(135deg,#6A1B9A,#AB47BC);color:#fff;border:none;border-radius:18px;padding:14px 32px;font-size:17px;font-family:'Fredoka One',cursive;cursor:pointer;touch-action:manipulation}
#recipe-screen-foot{background:#1A1A2E;padding:16px 20px calc(16px + env(safe-area-inset-bottom,0px));flex-shrink:0}
#next-btn{width:100%;background:linear-gradient(135deg,#FF6B35,#FF8C42);color:#fff;border:none;border-radius:18px;padding:16px;font-size:19px;font-family:'Fredoka One',cursive;cursor:pointer;box-shadow:0 5px 18px rgba(255,107,53,.42)}
</style>
<style>
*{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html{touch-action:pan-y;overscroll-behavior-y:none}
body{overflow-y:auto;overflow-x:hidden;position:relative;height:auto;overscroll-behavior-y:none;padding-bottom:80px}
[draggable=true],.pitem,.draggable{touch-action:none;-webkit-user-drag:none}
canvas{touch-action:none}
button,.btn,[role=button]{touch-action:manipulation}
</style>
<style>
@media(min-width:768px){
  body{max-width:680px;margin-left:auto;margin-right:auto}
  #app,.app-container,.game-container{max-width:680px;margin-left:auto;margin-right:auto}
  h1,#htitle{font-size:38px}
  h2{font-size:28px}
  p,.card-text{font-size:20px}
  .pitem,.draggable,.card{min-width:90px;min-height:90px}
  .btn,#nbtn,#start-btn,.cta-btn{font-size:22px;padding:20px}
  img{max-width:100%;object-fit:contain}
}
</style>
</head>
<body>
<div id="app">
  <div id="hdr">
    <div id="badge">🇮🇹 משחק 2 - מאפה פסטה וגבינות</div>
    <h2 id="htitle">🧩 סדרו את שלבי המתכון!</h2>
    <p id="hsub">גררו את הכרטיסים לסדר הנכון של הכנת מאפה פסטה וגבינות</p>
  </div>

  <div id="top-row">
    <span id="prog-txt">6 שלבים לסדר</span>
    <div id="top-btns">
      <button id="skip-btn" onclick="skipGame()">דלג ←</button>
      <button id="check-btn" onclick="checkOrder()">✅ בדקו!</button>
    </div>
  </div>

  <div id="list"></div>
  <div id="hint-bar">🔀 גררו כרטיסים להחלפה בין המיקומים</div>

  <div id="done-panel">
    <div id="stars">
      <span class="str" id="s0" style="animation:starPop .5s 0s both">⭐</span>
      <span class="str" id="s1" style="animation:starPop .5s .18s both">⭐</span>
      <span class="str" id="s2" style="animation:starPop .5s .36s both">⭐</span>
    </div>
    <p id="dmsg">🎉 סדרתם את המתכון בצורה מושלמת!</p>
    <button id="nbtn" style="margin-top:10px" onclick="showRecipeScreen()">📋 צפו במתכון המלא</button>
  </div>
</div>

<!-- Recipe Screen -->
<div id="recipe-screen">
  <div id="recipe-screen-hdr">
    <div id="recipe-screen-title">הנה המתכון המלא! 🧀</div>
  </div>
  <div id="recipe-scroll">
    <iframe id="recipe-iframe" src="assets/recipe_pasta_bake.pdf"
            title="מתכון מאפה פסטה וגבינות"
            onload="onIframeLoad(this)"
            onerror="showFallback()"></iframe>
    <div id="recipe-fallback">
      <div>📄 לפתיחת המתכון לחצו על הכפתור</div>
      <button id="dl-btn" onclick="openPDF()">פתחו את המתכון</button>
    </div>
  </div>
  <div id="recipe-screen-foot">
    <button id="next-btn" onclick="window.location.href='index.html'">🏠 חזרה לתפריט</button>
  </div>
</div>


<script>
const STEPS=[
  {id:1, img:'assets/pasta_bake_step1.png'},
  {id:2, img:'assets/pasta_bake_step2.png'},
  {id:3, img:'assets/pasta_bake_step3.png'},
  {id:4, img:'assets/pasta_bake_step4.png'},
  {id:5, img:'assets/pasta_bake_step5.png'},
  {id:6, img:'assets/pasta_bake_step6.png'},
];

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];
  }
  return a.every((s,i)=>s.id===i+1)?shuffle(arr):a;
}

let order=shuffle(STEPS);
let checked=false;
let dragSrc=null;
let touchCard=null, touchClone=null, touchSrcIdx=null;

function buildList(){
  const list=document.getElementById('list');
  list.innerHTML='';
  order.forEach((step,i)=>{
    const card=document.createElement('div');
    card.className='card';card.dataset.idx=i;card.draggable=true;
    card.innerHTML=`<img class="card-img" src="${step.img}" alt="שלב ${step.id}"><div class="card-badge">${i+1}</div>`;
    card.addEventListener('dragstart',onDragStart);
    card.addEventListener('dragover',onDragOver);
    card.addEventListener('dragleave',onDragLeave);
    card.addEventListener('drop',onDrop);
    card.addEventListener('dragend',onDragEnd);
    card.addEventListener('touchstart',onTouchStart,{passive:true});
    card.addEventListener('touchmove',onTouchMove,{passive:false});
    card.addEventListener('touchend',onTouchEnd);
    list.appendChild(card);
  });
  document.getElementById('check-btn').classList.add('ready');
}

function onDragStart(e){if(checked)return;dragSrc=this;this.classList.add('dragging');e.dataTransfer.effectAllowed='move';}
function onDragOver(e){e.preventDefault();if(this!==dragSrc)this.classList.add('over');}
function onDragLeave(){this.classList.remove('over');}
function onDrop(e){
  e.preventDefault();if(this===dragSrc||checked)return;
  const a=parseInt(dragSrc.dataset.idx),b=parseInt(this.dataset.idx);
  [order[a],order[b]]=[order[b],order[a]];buildList();
}
function onDragEnd(){document.querySelectorAll('.card').forEach(c=>c.classList.remove('dragging','over'));}

function onTouchStart(e){
  if(checked)return;
  touchCard=this;touchSrcIdx=parseInt(this.dataset.idx);
  const t=e.touches[0],r=this.getBoundingClientRect();
  touchClone=this.cloneNode(true);
  touchClone.style.cssText=`position:fixed;z-index:9999;width:${r.width}px;opacity:.88;top:${r.top}px;left:${r.left}px;pointer-events:none;border-radius:16px;box-shadow:0 8px 28px rgba(0,0,0,.22);background:#F3E5F5;border:2px solid #6A1B9A;transform:scale(1.04);`;
  document.body.appendChild(touchClone);
  this.classList.add('dragging');
  this._oy=t.clientY-r.top;this._ox=t.clientX-r.left;
}
function onTouchMove(e){
  if(!touchClone)return;e.preventDefault();
  const t=e.touches[0];
  touchClone.style.top=(t.clientY-this._oy)+'px';
  touchClone.style.left=(t.clientX-this._ox)+'px';
  touchClone.style.display='none';
  const el=document.elementFromPoint(t.clientX,t.clientY);
  touchClone.style.display='';
  document.querySelectorAll('.card').forEach(c=>c.classList.remove('over'));
  const tgt=el?.closest('.card');
  if(tgt&&tgt!==touchCard)tgt.classList.add('over');
}
function onTouchEnd(e){
  if(!touchClone)return;
  const t=e.changedTouches[0];
  touchClone.remove();touchClone=null;
  touchCard.classList.remove('dragging');
  document.querySelectorAll('.card').forEach(c=>c.classList.remove('over'));
  const el=document.elementFromPoint(t.clientX,t.clientY);
  const tgt=el?.closest('.card');
  if(tgt&&tgt!==touchCard){
    const b=parseInt(tgt.dataset.idx);
    [order[touchSrcIdx],order[b]]=[order[b],order[touchSrcIdx]];
    buildList();
  }
  touchCard=null;touchSrcIdx=null;
}

function checkOrder(){
  if(checked)return;
  const correct=order.filter((s,i)=>s.id===i+1).length;
  const cards=document.querySelectorAll('.card');
  if(correct===STEPS.length){
    checked=true;
    cards.forEach(c=>c.classList.add('correct'));
    document.getElementById('hint-bar').textContent='🎉 מושלם! הסדר נכון לגמרי!';
    document.getElementById('check-btn').style.display='none';
    aud(true);setTimeout(()=>showDone(3),900);
  } else {
    cards.forEach((c,i)=>{
      c.classList.remove('correct','wrong');
      c.classList.add(order[i].id===i+1?'correct':'wrong');
    });
    const stars=correct>=STEPS.length-2?2:1;
    document.getElementById('hint-bar').textContent=`${correct} מתוך ${STEPS.length} במקום הנכון – נסו שוב! 💪`;
    aud(false);
    setTimeout(()=>{
      if(correct>=STEPS.length-2){checked=true;setTimeout(()=>showDone(stars),400);}
      else document.querySelectorAll('.card').forEach(c=>c.classList.remove('correct','wrong'));
    },1200);
  }
}

function showDone(stars){
  document.getElementById('hdr').classList.add('done');
  document.getElementById('htitle').textContent='🧀 מעולה – מאפה פסטה וגבינות מוכן!';
  document.getElementById('hsub').textContent='השלמתם את שני המשחקים! 🎉';
  document.getElementById('list').style.display='none';
  document.getElementById('top-row').style.display='none';
  document.getElementById('hint-bar').style.display='none';
  for(let i=stars;i<3;i++){
    const s=document.getElementById('s'+i);
    s.style.filter='grayscale(1) opacity(.25)';s.style.animation='none';
  }
  const msgs=['💪 ניסיון טוב!','👍 כמעט מושלם!','🎉 סדרתם את המתכון בצורה מושלמת!'];
  document.getElementById('dmsg').textContent=msgs[stars-1];
  document.getElementById('done-panel').style.display='flex';
  const d=JSON.parse(localStorage.getItem('italy_stars_detail')||'[]');
  while(d.length<3)d.push(0);
  d[2]=stars;
  localStorage.setItem('italy_stars_detail',JSON.stringify(d));
  localStorage.setItem('italy_stars',d.reduce((a,b)=>a+b,0));
}

function showRecipeScreen(){
  document.getElementById('recipe-screen').style.display='flex';
  // Give the iframe a moment; if it's blank after 3 s, show the fallback button
  setTimeout(function(){
    var f=document.getElementById('recipe-iframe');
    try{
      if(!f.contentDocument||!f.contentDocument.body||f.contentDocument.body.innerHTML==='')showFallback();
    }catch(e){
      // cross-origin or native PDF viewer — iframe is working, leave it
    }
  },3000);
}
function onIframeLoad(f){
  // On some Android WebViews the iframe loads but renders nothing for PDF
  try{
    if(f.contentDocument&&f.contentDocument.body&&f.contentDocument.body.innerHTML==='')showFallback();
  }catch(e){}
}
function showFallback(){
  document.getElementById('recipe-iframe').style.display='none';
  document.getElementById('recipe-fallback').style.display='flex';
}
function openPDF(){window.open('assets/recipe_pasta_bake.pdf','_blank');}
function skipGame(){if(!checked){checked=true;showDone(1);}}

function aud(ok){
  try{
    const a=new(window.AudioContext||window.webkitAudioContext)();
    const o=a.createOscillator(),g=a.createGain();
    o.connect(g);g.connect(a.destination);
    if(ok){
      o.frequency.setValueAtTime(440,a.currentTime);o.frequency.setValueAtTime(554,a.currentTime+.12);o.frequency.setValueAtTime(660,a.currentTime+.24);
      g.gain.setValueAtTime(.15,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.5);
      o.start();o.stop(a.currentTime+.5);
    }else{
      o.type='sawtooth';o.frequency.setValueAtTime(220,a.currentTime);o.frequency.exponentialRampToValueAtTime(110,a.currentTime+.2);
      g.gain.setValueAtTime(.1,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.25);
      o.start();o.stop(a.currentTime+.28);
    }
  }catch(e){}
}

buildList();
</script>
</body>
</html>
