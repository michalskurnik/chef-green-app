<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>סיימתם את הרפתקת איטליה! 🎉</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Assistant:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{min-height:100%;background:#1A3D1F;font-family:'Assistant',sans-serif;direction:rtl;-webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column;align-items:center;overflow-y:auto;overflow-x:hidden;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 40px)}

@keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(2deg)}}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 6px 28px rgba(245,146,30,.45)}50%{transform:scale(1.04);box-shadow:0 12px 38px rgba(245,146,30,.72)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

.page{width:100%;max-width:420px;padding:0 20px}

/* ── Hero banner ── */
#hero{
  width:100%;max-width:420px;
  background:#F5F0DC;
  border-radius:0 0 40px 40px;
  padding:calc(env(safe-area-inset-top,0px) + 32px) 24px 36px;
  text-align:center;position:relative;overflow:hidden;
  box-shadow:0 12px 44px rgba(0,0,0,.38);
  animation:fadeUp .5s ease both;
}
#hero::after{
  content:'';position:absolute;top:0;left:0;right:0;height:6px;
  background:linear-gradient(90deg,#2E7D32 33%,#fff 33%,#fff 66%,#C62828 66%);
}

.confetti{position:absolute;pointer-events:none;font-size:20px;animation:float ease-in-out infinite}

#trophy-icon{font-size:80px;animation:pop .6s ease .1s both;display:block;margin-bottom:12px;line-height:1}
#hero-title{font-family:'Fredoka One',cursive;font-size:28px;color:#1A3D1F;line-height:1.15;margin-bottom:8px}
#hero-sub{font-size:16px;font-weight:700;color:rgba(26,61,31,.62);line-height:1.6;margin-bottom:24px}

/* Stars display */
#stars-box{
  display:inline-flex;flex-direction:column;align-items:center;gap:6px;
  background:#1A3D1F;border-radius:24px;padding:14px 32px;
}
#stars-row{font-size:30px;letter-spacing:4px;line-height:1}
#stars-label{font-size:13px;font-weight:700;color:rgba(245,240,220,.6)}

/* ── Recipe list summary ── */
#summary{
  width:100%;max-width:420px;padding:22px 20px 0;
  animation:fadeUp .5s ease .15s both;opacity:0;animation-fill-mode:both;
}
#summary h3{font-family:'Fredoka One',cursive;font-size:18px;color:rgba(245,240,220,.72);margin-bottom:14px;text-align:center}
.recipe-row{
  display:flex;align-items:center;gap:12px;
  background:rgba(245,240,220,.07);
  border-radius:16px;padding:12px 16px;margin-bottom:8px;
  border:1px solid rgba(245,240,220,.1);
}
.recipe-row .icon{font-size:22px;width:36px;text-align:center;flex-shrink:0}
.recipe-row .rname{font-size:15px;font-weight:700;color:rgba(245,240,220,.88);flex:1}
.recipe-row .rstars{font-size:14px;letter-spacing:2px;flex-shrink:0}

/* ── Bottom buttons ── */
#actions{
  width:100%;max-width:420px;padding:24px 20px 0;
  display:flex;flex-direction:column;gap:12px;
  animation:fadeUp .5s ease .25s both;opacity:0;animation-fill-mode:both;
}
#btn-menu{
  background:linear-gradient(135deg,#F5921E,#F7C948);
  color:#fff;border:none;border-radius:22px;
  padding:18px 24px;font-size:22px;font-family:'Fredoka One',cursive;
  cursor:pointer;width:100%;
  box-shadow:0 6px 28px rgba(245,146,30,.5);
  animation:pulse 2.5s ease-in-out infinite;
  touch-action:manipulation;
}
#btn-menu:active{transform:scale(.97);animation:none}
#btn-again{
  background:rgba(245,240,220,.09);
  color:rgba(245,240,220,.7);
  border:2px solid rgba(245,240,220,.18);
  border-radius:22px;padding:14px 24px;
  font-size:16px;font-weight:800;font-family:'Assistant',sans-serif;
  cursor:pointer;width:100%;touch-action:manipulation;
}
#btn-again:active{opacity:.7}
</style>
</head>
<body>

<div id="hero">
  <div class="confetti" style="top:18px;right:24px;animation-duration:2.2s;animation-delay:0s">🎉</div>
  <div class="confetti" style="top:22px;left:28px;animation-duration:2.8s;animation-delay:.3s">🇮🇹</div>
  <div class="confetti" style="bottom:32px;right:44px;animation-duration:2.4s;animation-delay:.6s">⭐</div>
  <div class="confetti" style="bottom:28px;left:38px;animation-duration:2s;animation-delay:.1s">🌟</div>

  <span id="trophy-icon">🏆</span>
  <h1 id="hero-title">כל הכבוד!<br>סיימתם את הרפתקת איטליה!</h1>
  <p id="hero-sub">גיליתם את 4 המתכונים הסודיים מהמטבח האיטלקי</p>

  <div id="stars-box">
    <div id="stars-row">⭐⭐⭐</div>
    <div id="stars-label">כוכבים שנצברו</div>
  </div>
</div>

<div id="summary">
  <h3>המתכונים שגיליתם</h3>
  <div id="recipe-rows"></div>
</div>

<div id="actions">
  <button id="btn-menu" onclick="window.location.href='/app/packages.html'">חזרה לתפריט ←</button>
  <button id="btn-again" onclick="window.location.href='index.html'">שחקו שוב 🔄</button>
</div>

<script>
(function () {
  var RECIPES = [
    { name: 'פסטה סגולה',                    emoji: '🍝' },
    { name: 'ברוסקטה חיפושית',              emoji: '🐞' },
    { name: 'מאפה פסטה וגבינות',            emoji: '🧀' },
    { name: 'פנקוטה וניל עם סירופ רימונים', emoji: '🍮' },
  ];

  var detail = JSON.parse(localStorage.getItem('italy_stars_detail') || '[]');
  var total  = 0;
  for (var i = 0; i < 4; i++) total += (detail[i] || 0);

  // Stars display
  var MAX = RECIPES.length * 3;
  document.getElementById('stars-row').textContent   = '⭐'.repeat(total) + '☆'.repeat(Math.max(0, MAX - total));
  document.getElementById('stars-label').textContent = total + ' מתוך ' + MAX + ' כוכבים';

  // Recipe summary rows
  var container = document.getElementById('recipe-rows');
  RECIPES.forEach(function (r, i) {
    var s   = detail[i] || 0;
    var row = document.createElement('div');
    row.className = 'recipe-row';
    row.innerHTML =
      '<div class="icon">' + (s > 0 ? '✅' : r.emoji) + '</div>' +
      '<div class="rname">' + r.name + '</div>' +
      '<div class="rstars">' +
        '⭐'.repeat(s) + '☆'.repeat(Math.max(0, 3 - s)) +
      '</div>';
    container.appendChild(row);
  });

  // Personalise greeting
  var name = localStorage.getItem('chefName');
  if (name) {
    document.getElementById('hero-sub').textContent =
      name + ', גיליתם את 4 המתכונים הסודיים מהמטבח האיטלקי!';
  }
})();
</script>
</body>
</html>
