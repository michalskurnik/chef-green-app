<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>תעודת שף מתחיל 🏆</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
*{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html{touch-action:pan-y;overscroll-behavior-y:none}
body{
  background:#f5f0dc;
  font-family:'Rubik',sans-serif;
  direction:rtl;
  overflow-y:auto;
  overflow-x:hidden;
  position:relative;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 32px);
}

/* ── Certificate section ── */
.cert-section{
  width:100%;
  display:flex;
  justify-content:center;
  background:#f5f0dc;
}

.cert-wrap{
  position:relative;
  width:100%;
  max-width:640px;
  flex-shrink:0;
  overflow:visible;
}
.cert-bg{
  width:100%;
  display:block;
  /* image is 2400×1792 → ratio 1.3393 */
}

.cert-name{
  position:absolute;
  top:39%;
  left:50%;
  transform:translateX(-50%);
  font-family:'Fredoka One',cursive;
  font-size:clamp(14px,4.8vw,36px);
  color:#8B4513;
  white-space:nowrap;
  text-align:center;
  text-shadow:0 1px 4px rgba(255,255,255,.9);
  pointer-events:none;
  letter-spacing:.5px;
  max-width:55%;
  overflow:hidden;
  text-overflow:ellipsis;
}

.cert-photo-wrap{
  position:absolute;
  top:63%;
  left:50%;
  transform:translate(-50%,-50%);
  width:31%;
  aspect-ratio:1;
  border-radius:50%;
  overflow:hidden;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,253,240,.15);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
  transition:opacity .15s;
}
.cert-photo-wrap:active{opacity:.8}

.cert-photo-img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
  display:none;
}
.cert-camera-hint{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
  pointer-events:none;
}
.cam-icon{font-size:clamp(18px,6vw,48px);line-height:1}
.cam-label{
  font-family:'Rubik',sans-serif;
  font-size:clamp(7px,2vw,13px);
  font-weight:700;
  color:#7a5c1e;
  text-align:center;
  line-height:1.25;
}

.cert-achievement{
  position:absolute;
  top:79%;
  left:50%;
  transform:translateX(-50%);
  font-family:'Rubik',sans-serif;
  font-size:clamp(8px,2.2vw,15px);
  font-weight:600;
  color:#5a3e1b;
  white-space:nowrap;
  text-align:center;
  pointer-events:none;
  text-shadow:0 1px 3px rgba(255,255,255,.8);
}

.btn-wa:disabled{opacity:.7;cursor:not-allowed;transform:none!important}

/* ── Buttons ── */
.buttons-section{
  max-width:480px;
  margin:0 auto;
  padding:20px 20px 48px;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.btn-wa{
  display:block;
  width:100%;
  background:#25D366;
  color:#fff;
  text-align:center;
  text-decoration:none;
  font-family:'Rubik',sans-serif;
  font-size:17px;
  font-weight:700;
  padding:16px 24px;
  border-radius:50px;
  border:none;
  cursor:pointer;
  box-shadow:0 4px 18px rgba(37,211,102,.4);
  touch-action:manipulation;
  transition:transform .1s,opacity .15s;
}
.btn-wa:active{transform:scale(.97);opacity:.9}

.btn-print{
  width:100%;
  background:#fff;
  color:#25D366;
  border:2px solid #25D366;
  border-radius:50px;
  padding:15px 24px;
  font-size:17px;
  font-family:'Rubik',sans-serif;
  font-weight:700;
  cursor:pointer;
  touch-action:manipulation;
  transition:transform .1s;
}
.btn-print:active{transform:scale(.97)}

.btn-next{
  display:block;
  width:100%;
  background:#F5921E;
  color:#fff;
  text-align:center;
  text-decoration:none;
  font-family:'Rubik',sans-serif;
  font-size:17px;
  font-weight:700;
  padding:16px 24px;
  border-radius:50px;
  border:none;
  cursor:pointer;
  box-shadow:0 4px 18px rgba(245,146,30,.4);
  touch-action:manipulation;
  transition:transform .1s;
}
.btn-next:active{transform:scale(.97)}

.btn-parents{
  display:block;
  width:100%;
  background:none;
  color:#7a5c1e;
  text-align:center;
  text-decoration:none;
  font-family:'Rubik',sans-serif;
  font-size:15px;
  font-weight:700;
  padding:12px 24px;
  border-radius:50px;
  border:2px dashed rgba(122,92,30,.3);
  cursor:pointer;
  touch-action:manipulation;
  transition:transform .1s;
}
.btn-parents:active{transform:scale(.97)}

/* ── Print ── */
@media print{
  .buttons-section{display:none!important}
  body{padding:0;background:#fff}
  .cert-section{display:block}
  .cert-wrap{max-width:100%!important;width:100%!important}
  .cert-camera-hint{display:none}
}

/* ── iPad ── */
@media(min-width:768px){
  .cert-wrap{max-width:640px;margin:0 auto}
  .cert-name{font-size:clamp(20px,3.2vw,42px)}
  .cert-achievement{font-size:clamp(10px,1.4vw,17px)}
  .cam-icon{font-size:clamp(24px,3.5vw,52px)}
  .cam-label{font-size:clamp(9px,1.2vw,15px)}
  .buttons-section{max-width:520px;padding:24px 24px 56px}
  .btn-wa,.btn-print,.btn-next{font-size:20px;padding:18px 28px}
}
</style>
</head>
<body>

<!-- ══ Certificate ══════════════════════════════════════ -->
<div class="cert-section">
  <div class="cert-wrap" id="certificate-card">

    <!-- Background image (shared generic certificate art, also used by the dinner package) -->
    <img src="../assets/images/certificate-bg.png"
         class="cert-bg"
         alt="תעודת שף מתחיל">

    <!-- Child's name (read from localStorage) -->
    <div class="cert-name" id="cert-name"></div>

    <!-- Photo upload circle (over rope-bordered avatar area) -->
    <div class="cert-photo-wrap" id="cert-photo-wrap">
      <img id="cert-photo-img" class="cert-photo-img" alt="">
      <div class="cert-camera-hint" id="cert-camera-hint">
        <span class="cam-icon">📷</span>
        <span class="cam-label">הוסיפו<br>תמונה</span>
      </div>
      <input type="file" id="photo-input" accept="image/*" style="display:none">
    </div>

    <!-- Achievement text (below photo area inside circle) -->
    <div class="cert-achievement">על השלמת הרפתקת איטליה 🇮🇹🍝</div>

  </div>
</div>

<!-- ══ Buttons ══════════════════════════════════════════ -->
<div class="buttons-section">
  <button id="btn-wa" class="btn-wa" onclick="shareCertificate()">
    שיתוף לוואטסאפ 📲
  </button>
  <button class="btn-print" onclick="window.print()">הדפסה 🖨️</button>
  <a href="../app/packages.html" class="btn-next">לבחירת הרפתקה הבאה ←</a>
  <a href="parents.html" class="btn-parents">👨‍👩‍👧‍👦 להורים</a>
</div>

<script>
(function () {
  'use strict';

  // ── Load child's name ──────────────────────────────────
  var chefName = localStorage.getItem('chefName') || '';
  if (chefName) {
    document.getElementById('cert-name').textContent = chefName;
  }

  // ── Photo upload — restore saved photo on load ─────────
  var photoWrap  = document.getElementById('cert-photo-wrap');
  var photoImg   = document.getElementById('cert-photo-img');
  var cameraHint = document.getElementById('cert-camera-hint');
  var photoInput = document.getElementById('photo-input');

  var savedPhoto = localStorage.getItem('childPhoto');
  if (savedPhoto) {
    photoImg.src = savedPhoto;
    photoImg.style.display = 'block';
    cameraHint.style.display = 'none';
  }

  photoWrap.addEventListener('click', function () {
    photoInput.click();
  });

  photoInput.addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function (ev) {
      var dataUrl = ev.target.result;
      localStorage.setItem('childPhoto', dataUrl);
      photoImg.src = dataUrl;
      photoImg.style.display = 'block';
      cameraHint.style.display = 'none';
    };
    reader.readAsDataURL(file);
  });

  // ── Share certificate via Canvas API ──────────────────
  window.shareCertificate = async function () {
    var btn = document.getElementById('btn-wa');
    var originalHTML = btn.innerHTML;
    btn.innerHTML = '⏳ מכין תמונה...';
    btn.disabled = true;

    try {
      // Step 1: draw certificate background.
      // Canvas size is derived from the background's real natural dimensions
      // (not hardcoded) so it always matches the file's actual aspect ratio -
      // no stretch, and a differently-sized replacement file (retina, etc.)
      // just works without touching this code.
      var bg = new Image();
      bg.crossOrigin = 'anonymous';
      bg.src = '../assets/images/certificate-bg.png';
      await new Promise(function (resolve, reject) {
        bg.onload = resolve;
        bg.onerror = reject;
      });

      var canvas = document.createElement('canvas');
      var W = 1200;
      var H = Math.round(W * (bg.naturalHeight / bg.naturalWidth));
      canvas.width  = W;
      canvas.height = H;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(bg, 0, 0, W, H);

      // Step 2: draw child's name.
      // Position/size as percentages of W/H, matching the live CSS overlay
      // (.cert-name: top 39%, centered, ~5.3% of width font size).
      var name = localStorage.getItem('chefName') || '';
      if (name) {
        ctx.font = 'bold ' + Math.round(W * 0.0533) + 'px "Fredoka One", sans-serif';
        ctx.fillStyle = '#8B4513';
        ctx.textAlign = 'center';
        ctx.direction = 'rtl';
        ctx.fillText(name, W * 0.5, H * 0.44);
      }

      // Step 3: draw the achievement caption.
      // This was previously never drawn on the canvas at all - the shared
      // image was silently missing it. Read live from the DOM so it can
      // never drift out of sync with the on-page text.
      var capEl = document.querySelector('.cert-achievement');
      if (capEl && capEl.textContent.trim()) {
        ctx.font = Math.round(W * 0.02) + 'px "Rubik", sans-serif';
        ctx.fillStyle = '#5a3e1b';
        ctx.textAlign = 'center';
        ctx.direction = 'rtl';
        ctx.fillText(capEl.textContent.trim(), W * 0.5, H * 0.80);
      }

      // Step 4: draw child's photo clipped to circle (if uploaded).
      // Circle diameter is 31% of W, matching the live CSS's .cert-photo-wrap
      // (previously hardcoded to a fixed radius that was only ~18.3% of W).
      var photoSrc = localStorage.getItem('childPhoto');
      if (photoSrc) {
        var photo = new Image();
        photo.src = photoSrc;
        await new Promise(function (resolve) { photo.onload = resolve; });

        var cx = W * 0.5, cy = H * 0.63, radius = W * 0.155;
        var size = radius * 2;
        var imgRatio = photo.width / photo.height;
        var drawW, drawH, drawX, drawY;

        if (imgRatio > 1) {
          // Landscape — fit height, overflow width
          drawH = size;
          drawW = size * imgRatio;
          drawX = cx - drawW / 2;
          drawY = cy - radius;
        } else {
          // Portrait — fit width, overflow height
          drawW = size;
          drawH = size / imgRatio;
          drawX = cx - radius;
          drawY = cy - drawH / 2;
        }

        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.closePath();
        ctx.clip();
        ctx.drawImage(photo, drawX, drawY, drawW, drawH);
        ctx.restore();
      }

      // Step 5: share or download
      var blob = await new Promise(function (resolve) {
        canvas.toBlob(resolve, 'image/png', 1.0);
      });
      var imageFile = new File([blob], 'תעודת-שף.png', { type: 'image/png' });

      if (navigator.canShare && navigator.canShare({ files: [imageFile] })) {
        await navigator.share({
          files: [imageFile],
          title: 'תעודת שף מוסמך! 🎓',
          text: name ? name + ' קיבל תעודת שף מוסמך! 👨‍🍳🎉' : 'הילד שלי קיבל תעודת שף מוסמך! 👨‍🍳🎉'
        });
      } else {
        // Fallback: download the image
        var a = document.createElement('a');
        a.download = 'תעודת-שף.png';
        a.href = canvas.toDataURL('image/png', 1.0);
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }

    } catch (err) {
      if (err.name !== 'AbortError') {
        console.error('Share failed:', err);
      }
    } finally {
      btn.innerHTML = originalHTML;
      btn.disabled = false;
    }
  };
})();
</script>

</body>
</html>
