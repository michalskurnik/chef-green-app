<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>סיימתם את הרפתקת איטליה! 🎉</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Assistant:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{min-height:100%;background:#1A3D1F;font-family:'Assistant',sans-serif;direction:rtl;-webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column;align-items:center;overflow-y:auto;overflow-x:hidden;position:relative;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px)}

:root{
  --green-deep:#1A3D1F;
  --green-mid:#2E7D32;
  --gold:#F7C948;
  --gold-deep:#F5921E;
  --cream:#F5F0DC;
}

@keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(2deg)}}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 6px 28px rgba(245,146,30,.45)}50%{transform:scale(1.04);box-shadow:0 12px 38px rgba(245,146,30,.72)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes shimmer{0%{background-position:200% center}100%{background-position:-200% center}}
@keyframes badgeGlow{0%,100%{filter:drop-shadow(0 0 16px rgba(247,201,72,.55)) drop-shadow(0 8px 20px rgba(0,0,0,.25))}50%{filter:drop-shadow(0 0 30px rgba(247,201,72,.85)) drop-shadow(0 8px 28px rgba(0,0,0,.3))}}
@keyframes badgeBounce{0%{transform:translateY(-50px) scale(.7);opacity:0}60%{transform:translateY(6px) scale(1.05)}80%{transform:translateY(-3px) scale(.98)}100%{transform:translateY(0) scale(1);opacity:1}}
@keyframes sparkle{0%,100%{opacity:0;transform:scale(0) rotate(0)}50%{opacity:1;transform:scale(1) rotate(180deg)}}
@keyframes cardReveal{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}

.page{width:100%;max-width:420px;padding:0 20px}

/* ── Sparkle layer ── */
.sparkles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.sp{position:absolute;width:6px;height:6px;background:var(--gold);
    clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
    animation:sparkle ease-in-out infinite}

/* ── Hero banner ── */
#hero{
  width:100%;max-width:420px;
  background:var(--cream);
  border-radius:0 0 40px 40px;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 24px 14px;
  text-align:center;position:relative;overflow:hidden;
  box-shadow:0 12px 44px rgba(0,0,0,.38);
  animation:fadeUp .5s ease both;
  z-index:1;
}
#hero::after{
  content:'';position:absolute;top:0;left:0;right:0;height:6px;
  background:linear-gradient(90deg,#2E7D32 33%,#fff 33%,#fff 66%,#C62828 66%);
}

.confetti{position:absolute;pointer-events:none;font-size:20px;animation:float ease-in-out infinite}

/* Badge (emoji standing in for an image badge, same glow/ring/bounce treatment) */
.badge-wrap{
  position:relative;width:84px;height:84px;
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 2px;
  animation:badgeBounce .9s cubic-bezier(.22,.61,.36,1) .1s both;
}
.badge-ring{
  position:absolute;inset:-8px;border-radius:50%;
  background:conic-gradient(from 0deg,rgba(247,201,72,.6),rgba(247,201,72,0),rgba(247,201,72,.6),rgba(247,201,72,0),rgba(247,201,72,.6));
  animation:shimmer 4s linear infinite;filter:blur(3px);
}
#trophy-icon{
  font-size:48px;line-height:1;position:relative;z-index:1;display:block;
  animation:pop .6s ease .1s both,badgeGlow 3s ease-in-out infinite;
}

#hero-title{font-family:'Fredoka One',cursive;font-size:19px;color:#1A3D1F;line-height:1.15;margin-bottom:4px}
#hero-sub{font-size:13px;font-weight:700;color:rgba(26,61,31,.62);line-height:1.3}

/* ── Twist section: one big line ── */
#twist{
  width:100%;max-width:420px;padding:8px 0 0;
  display:flex;flex-direction:column;align-items:center;
  position:relative;z-index:1;
  animation:fadeUp .5s .3s both ease;
}
.twist-bubble{
  background:linear-gradient(135deg,var(--green-mid),#4CAF50);
  border-radius:18px;padding:9px 18px;text-align:center;
  box-shadow:0 4px 20px rgba(0,0,0,.25);width:100%;
}
.twist-text{
  font-family:'Fredoka One',cursive;font-size:16px;color:#fff;line-height:1.2;
}

/* ── Recipe grid: 4 big colorful cards with a checkmark ── */
#summary{width:100%;max-width:420px;padding:8px 0 0;position:relative;z-index:1}
.recipe-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:9px;
}
.recipe-card{
  position:relative;aspect-ratio:1.9;border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  font-size:30px;
  box-shadow:0 4px 16px rgba(0,0,0,.25);
  opacity:0;animation:cardReveal .45s ease both;
}
.recipe-card .check{
  position:absolute;top:-8px;left:-8px;
  width:30px;height:30px;border-radius:50%;
  background:#fff;color:var(--green-mid);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:900;
  box-shadow:0 3px 10px rgba(0,0,0,.3);
  animation:pop .4s ease .3s both;
}

/* ── CTAs ── */
#actions{
  width:100%;max-width:420px;padding:10px 0 0;
  display:flex;flex-direction:column;gap:7px;
  position:relative;z-index:1;
  animation:fadeUp .5s .25s both ease;
}
.btn-photo{
  width:100%;background:linear-gradient(135deg,#F5921E,#F7C948);
  color:#fff;border:none;border-radius:20px;padding:12px 24px;
  font-size:17px;font-family:'Fredoka One',cursive;cursor:pointer;
  box-shadow:0 6px 28px rgba(245,146,30,.5);
  animation:pulse 2.5s ease-in-out infinite;
  touch-action:manipulation;position:relative;overflow:hidden;
}
.btn-photo::before{
  content:'';position:absolute;top:-50%;right:-60%;width:80px;height:200%;
  background:rgba(255,255,255,.15);transform:skewX(-20deg);
  animation:shimmer 2.5s ease-in-out infinite;
}
.btn-photo:active{transform:scale(.97);animation:none}
.btn-row{display:flex;gap:10px}
.btn-secondary{
  flex:1;background:rgba(245,240,220,.09);color:rgba(245,240,220,.85);
  border:2px solid rgba(245,240,220,.25);border-radius:18px;padding:11px 10px;
  font-size:14px;font-weight:800;font-family:'Assistant',sans-serif;
  cursor:pointer;touch-action:manipulation;
}
.btn-secondary:active{opacity:.7}
.btn-tertiary{
  background:none;color:rgba(245,240,220,.55);
  border:2px dashed rgba(245,240,220,.25);border-radius:18px;padding:10px 10px;
  font-size:13px;font-weight:800;font-family:'Assistant',sans-serif;
  cursor:pointer;width:100%;touch-action:manipulation;
}
.btn-tertiary:active{opacity:.7}

/* ── iPad ── */
@media(min-width:768px){
  .page,#hero,#twist,#summary,#actions{max-width:520px}
}
</style>
</head>
<body>

<div class="sparkles" id="sparkles"></div>

<div id="hero">
  <div class="confetti" style="top:18px;right:24px;animation-duration:2.2s;animation-delay:0s">🎉</div>
  <div class="confetti" style="top:22px;left:28px;animation-duration:2.8s;animation-delay:.3s">🇮🇹</div>
  <div class="confetti" style="bottom:32px;right:44px;animation-duration:2.4s;animation-delay:.6s">⭐</div>
  <div class="confetti" style="bottom:28px;left:38px;animation-duration:2s;animation-delay:.1s">🌟</div>

  <div class="badge-wrap">
    <div class="badge-ring"></div>
    <span id="trophy-icon">🏆</span>
  </div>
  <h1 id="hero-title">כל הכבוד!<br>סיימתם את הרפתקת איטליה!</h1>
  <p id="hero-sub">גיליתם את 4 המתכונים הסודיים מהמטבח האיטלקי</p>
</div>

<div class="page">
  <div id="twist">
    <div class="twist-bubble">
      <p class="twist-text">🎉 יש 4 מתכונים איטלקיים מושלמים!</p>
    </div>
  </div>

  <div id="summary">
    <div class="recipe-grid" id="recipe-grid"></div>
  </div>

  <div id="actions">
    <button class="btn-photo" onclick="sendPhoto()">שלחו לנו תמונה 📸</button>
    <div class="btn-row">
      <button class="btn-secondary" onclick="goHub()">🏠 חזרה לבית</button>
      <button class="btn-secondary" onclick="window.location.href='parents.html'">👨‍👩‍👧‍👦 להורים</button>
    </div>
    <button class="btn-tertiary" onclick="replay()">🔄 נסו שוב</button>
  </div>
</div>

<script>
(function () {
  var RECIPES = [
    { emoji: '🍝', color: '#7B2D8B' },
    { emoji: '🐞', color: '#8B4513' },
    { emoji: '🧀', color: '#D4872A' },
    { emoji: '🍮', color: '#B5186A' },
  ];

  var detail = JSON.parse(localStorage.getItem('italy_stars_detail') || '[]');

  var grid = document.getElementById('recipe-grid');
  RECIPES.forEach(function (r, i) {
    var done = (detail[i] || 0) > 0;
    var card = document.createElement('div');
    card.className = 'recipe-card';
    card.style.background = r.color;
    card.style.animationDelay = (0.1 + i * 0.1) + 's';
    card.innerHTML = r.emoji + (done ? '<span class="check">✓</span>' : '');
    grid.appendChild(card);
  });

  var name = localStorage.getItem('chefName');
  if (name) {
    document.getElementById('hero-sub').textContent =
      name + ', גיליתם את 4 המתכונים הסודיים מהמטבח האיטלקי!';
  }

  // Sparkles
  var c = document.getElementById('sparkles');
  var cols = ['#F7C948', '#FFD54F', '#F5921E', '#4CAF50', '#FFCA28'];
  for (var k = 0; k < 24; k++) {
    var s2 = document.createElement('div');
    s2.className = 'sp';
    var size = (Math.random() * 6 + 4) + 'px';
    s2.style.cssText = [
      'width:' + size, 'height:' + size,
      'top:' + Math.random() * 100 + '%',
      'left:' + Math.random() * 100 + '%',
      'background:' + cols[Math.floor(Math.random() * cols.length)],
      'animation-duration:' + (3 + Math.random() * 4) + 's',
      'animation-delay:' + (Math.random() * 5) + 's'
    ].join(';');
    c.appendChild(s2);
  }
})();

function sendPhoto() {
  var msg = encodeURIComponent('הנה המנה האיטלקית שהכנו עם השף הירוק! 🇮🇹✨');
  window.open('https://wa.me/972547836788?text=' + msg, '_blank');
}
function goHub() {
  window.location.href = 'index.html';
}
function replay() {
  if (confirm('לאפס את ההרפתקה ולהתחיל מחדש?')) {
    localStorage.removeItem('italy_stars_detail');
    localStorage.removeItem('italy_stars');
    window.location.href = 'index.html';
  }
}
</script>
</body>
</html>
